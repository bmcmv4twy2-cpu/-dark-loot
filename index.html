<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DARK LOOT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:#fff;
  font-family:
    Arial,
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:520px;
  margin:auto;
  overflow:hidden;
  background:#09080c;
}

/* =========================================================
   全体背景
========================================================= */

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  overflow:hidden;
}

.screen.active{
  display:flex;
}

/* 背景画像 */
.dungeon-background{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.28),
      rgba(0,0,0,.72)
    ),
    url("./annomotion-102.png") center/cover no-repeat,
    radial-gradient(circle,#30263d,#07070a 75%);
  z-index:0;
}

.dungeon-background::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.7) 100%
    );
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:relative;
  z-index:20;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 9px;

  background:
    linear-gradient(
      180deg,
      rgba(42,35,48,.98),
      rgba(12,10,16,.98)
    );

  border-bottom:2px solid #745b38;
  box-shadow:0 4px 15px rgba(0,0,0,.8);
}

.logo-mini{
  width:88px;
  max-height:48px;
  object-fit:contain;
  filter:drop-shadow(0 3px 4px #000);
}

.currency{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:86px;
  padding:6px 9px;

  border-radius:10px;

  background:
    linear-gradient(180deg,#29242e,#111016);

  border:1px solid #675437;

  box-shadow:
    inset 0 1px rgba(255,255,255,.1),
    0 2px 7px #000;

  font-size:12px;
}

.gold{
  color:#ffd866;
}

.ruby{
  color:#ff668b;
}

/* =========================================================
   COMMON BUTTON
========================================================= */

.btn{
  min-height:46px;
  padding:8px 12px;

  border-radius:11px;

  background:
    linear-gradient(180deg,#514756,#201b26);

  border:1px solid #806847;

  box-shadow:
    inset 0 1px rgba(255,255,255,.12),
    0 3px 7px #000;

  font-weight:bold;
}

.btn:active{
  transform:translateY(2px);
}

.btn.gold-btn{
  background:
    linear-gradient(180deg,#826238,#382617);

  border-color:#c79a55;
}

.btn.red-btn{
  background:
    linear-gradient(180deg,#783c47,#30171d);

  border-color:#b65b69;
}

.btn.green-btn{
  background:
    linear-gradient(180deg,#34775d,#143126);

  border-color:#66c39a;
}

.btn.purple-btn{
  background:
    linear-gradient(180deg,#704b83,#281a31);

  border-color:#b47bce;
}

/* =========================================================
   HOME
========================================================= */

#home{
  justify-content:center;
  align-items:center;
  text-align:center;
}

.home-bg{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.15),
      rgba(0,0,0,.72)
    ),
    url("./annomotion-102.png") center/cover no-repeat;

  filter:saturate(.85);
}

.home-content{
  position:relative;
  z-index:5;
  width:90%;
  max-width:390px;
}

.game-logo{
  width:90%;
  max-height:160px;
  object-fit:contain;

  filter:
    drop-shadow(0 5px 10px #000)
    drop-shadow(0 0 20px rgba(180,100,255,.25));

  margin-bottom:22px;
}

.home-subtitle{
  color:#c7b89c;
  letter-spacing:3px;
  font-size:12px;
  margin-bottom:22px;
}

.start-button{
  width:100%;
  min-height:62px;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      #927143,
      #382617
    );

  border:2px solid #d1a75f;

  box-shadow:
    inset 0 2px rgba(255,255,255,.15),
    0 6px 20px #000;

  font-size:19px;
  font-weight:bold;
  letter-spacing:3px;
}

.reset-button{
  margin-top:12px;
  background:rgba(20,18,24,.8);
  border:1px solid #4d4551;
  padding:8px 15px;
  border-radius:9px;
  font-size:10px;
}

/* =========================================================
   BATTLE
========================================================= */

#battle{
  background:#07070a;
}

.battle-area{
  position:relative;
  flex:1;
  overflow:hidden;
}

.battle-background{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.15),
      rgba(0,0,0,.65)
    ),
    url("./annomotion-102.png") center/cover no-repeat;
}

.battle-vignette{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.7) 100%
    );
}

/* wave */

.wave-info{
  position:relative;
  z-index:5;
  text-align:center;
  padding-top:8px;
}

.stage-name{
  color:#cfc2aa;
  font-size:11px;
  letter-spacing:2px;
}

.wave-number{
  margin-top:3px;
  color:#ffd36a;
  font-weight:bold;
}

/* enemy */

.enemy-area{
  position:relative;
  z-index:5;
  text-align:center;
  margin-top:10px;
}

.enemy-image{
  width:145px;
  height:145px;
  object-fit:contain;

  filter:
    drop-shadow(0 10px 12px #000)
    drop-shadow(0 0 16px rgba(180,40,60,.35));

  animation:enemyFloat 2.4s ease-in-out infinite;
}

@keyframes enemyFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }
}

.enemy-image.hit{
  animation:enemyHit .18s linear;
}

@keyframes enemyHit{
  0%{transform:translateX(0)}
  25%{transform:translateX(-10px)}
  50%{transform:translateX(10px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

.enemy-name{
  font-size:15px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

.hp-container{
  width:76%;
  max-width:310px;
  margin:7px auto;
}

.hp-label{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:#ddd;
}

.hp-bar{
  height:12px;
  margin-top:4px;

  border-radius:20px;

  overflow:hidden;

  background:#160f14;
  border:1px solid #72454c;

  box-shadow:
    inset 0 2px 4px #000;
}

.hp-fill{
  height:100%;
  width:100%;

  background:
    linear-gradient(
      180deg,
      #ff6c72,
      #a50d29
    );

  transition:width .15s;
}

/* player */

.player-area{
  position:absolute;
  left:0;
  right:0;
  bottom:16px;
  z-index:5;

  text-align:center;
}

.player-image{
  width:150px;
  height:170px;
  object-fit:contain;

  filter:
    drop-shadow(0 12px 15px #000)
    drop-shadow(0 0 12px rgba(70,100,255,.25));
}

.player-name{
  font-size:12px;
  color:#ddd;
}

/* damage */

.damage-number{
  position:absolute;
  z-index:50;

  color:#ff6969;
  font-size:24px;
  font-weight:bold;

  text-shadow:
    0 2px 5px #000;

  animation:damageUp .8s ease-out forwards;

  pointer-events:none;
}

@keyframes damageUp{
  0%{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  100%{
    opacity:0;
    transform:translateY(-65px) scale(1.2);
  }
}

/* battle controls */

.battle-controls{
  position:relative;
  z-index:20;

  display:grid;
  grid-template-columns:1fr 1.35fr 1fr;
  gap:7px;

  padding:8px;

  background:
    linear-gradient(
      180deg,
      rgba(29,25,34,.98),
      rgba(7,6,10,.98)
    );

  border-top:2px solid #665139;
}

.auto-on{
  background:
    linear-gradient(180deg,#39795f,#143428) !important;

  border-color:#65c49a !important;
}

/* =========================================================
   NAV
========================================================= */

.nav{
  position:relative;
  z-index:30;

  height:68px;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  background:
    linear-gradient(
      180deg,
      #29242f,
      #0e0c12
    );

  border-top:2px solid #705637;
}

.nav button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;

  background:transparent;

  color:#9f99a6;
  font-size:9px;
}

.nav button span{
  font-size:21px;
}

.nav button.active{
  color:#ffd86b;
}

/* =========================================================
   SUB SCREEN
========================================================= */

.sub-screen{
  background:
    linear-gradient(
      180deg,
      rgba(13,11,17,.92),
      #07070a
    );
}

.sub-header{
  position:relative;
  z-index:10;

  height:65px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(180deg,#302a36,#111016);

  border-bottom:2px solid #6c5639;

  font-weight:bold;
  letter-spacing:2px;
}

.back{
  position:absolute;
  left:10px;

  width:40px;
  height:38px;

  border-radius:10px;

  background:#211c27;
  border:1px solid #745c3d;

  font-size:20px;
}

.sub-content{
  flex:1;
  overflow:hidden;
  padding:10px;
}

/* =========================================================
   PANEL
========================================================= */

.panel{
  margin-bottom:10px;
  padding:12px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(51,44,59,.96),
      rgba(14,12,18,.97)
    );

  border:1px solid #7d6748;

  box-shadow:
    inset 0 1px rgba(255,255,255,.07),
    0 4px 12px #000;
}

.panel-title{
  margin-bottom:10px;

  color:#f0cc78;
  font-weight:bold;
  font-size:14px;
}

/* =========================================================
   EQUIPMENT
========================================================= */

.equipment-character{
  text-align:center;
  padding:5px;
}

.equipment-character img{
  width:120px;
  height:130px;
  object-fit:contain;

  filter:drop-shadow(0 7px 10px #000);
}

.equipment-slots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.equipment-slot{
  min-height:95px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:5px;

  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #312a38,
      #121016
    );

  border:1px solid #62533f;
}

.equipment-icon{
  width:47px;
  height:47px;
  object-fit:contain;

  filter:drop-shadow(0 3px 4px #000);
}

.equipment-slot-name{
  margin-top:4px;
  font-size:9px;
  color:#bfb6c6;
}

.equipped-label{
  margin-top:4px;

  padding:2px 6px;

  border-radius:5px;

  background:#123b2c;
  border:1px solid #3d8b68;

  color:#7dffc1;

  font-size:8px;
}

/* =========================================================
   INVENTORY
========================================================= */

.inventory-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.inventory-item{
  position:relative;

  min-height:82px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      #302938,
      #121016
    );

  border:1px solid #5f503e;
}

.inventory-item img{
  width:45px;
  height:45px;
  object-fit:contain;

  filter:drop-shadow(0 3px 4px #000);
}

.inventory-item.empty{
  opacity:.4;
}

.item-count{
  position:absolute;
  right:4px;
  bottom:3px;

  padding:1px 4px;

  border-radius:4px;

  background:#08070b;

  font-size:9px;
}

/* item detail */

.item-detail{
  text-align:center;
}

.item-detail img{
  width:90px;
  height:90px;
  object-fit:contain;
}

.item-detail-name{
  font-size:17px;
  color:#ffd878;
  font-weight:bold;
}

.item-detail-stat{
  margin-top:5px;
  color:#b9b0bf;
  font-size:12px;
}

.detail-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

/* =========================================================
   UPGRADE
========================================================= */

.upgrade-row{
  display:grid;
  grid-template-columns:58px 1fr auto;
  align-items:center;
  gap:8px;

  padding:9px 0;

  border-bottom:1px solid #332d38;
}

.upgrade-icon{
  width:52px;
  height:52px;
  object-fit:contain;
}

.upgrade-name{
  font-size:13px;
  font-weight:bold;
}

.upgrade-stat{
  margin-top:3px;
  color:#aaa2b1;
  font-size:10px;
}

.upgrade-button{
  min-width:70px;
  padding:8px;

  border-radius:9px;

  background:
    linear-gradient(180deg,#775b31,#352416);

  border:1px solid #b99151;

  font-size:10px;
}

/* =========================================================
   RANKING
========================================================= */

.ranking-row{
  display:grid;
  grid-template-columns:38px 1fr auto;

  align-items:center;

  padding:11px 5px;

  border-bottom:1px solid #302a35;
}

.rank-number{
  font-size:19px;
  color:#f0ca6b;
}

.rank-name{
  font-size:13px;
}

.rank-power{
  color:#a59eac;
  font-size:10px;
}

/* =========================================================
   REBIRTH
========================================================= */

.rebirth{
  text-align:center;
  padding:15px;
}

.rebirth-icon{
  font-size:65px;

  filter:
    drop-shadow(0 0 20px rgba(180,90,255,.55));
}

.rebirth-title{
  margin-top:8px;

  color:#e0a8ff;
  font-size:19px;
  font-weight:bold;
}

.rebirth-description{
  margin-top:8px;

  color:#aaa0b2;
  font-size:11px;
  line-height:1.7;
}

.rebirth-button{
  width:100%;
  min-height:54px;

  margin-top:15px;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #754f91,
      #281a35
    );

  border:1px solid #b77ed5;

  font-weight:bold;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:absolute;
  left:50%;
  bottom:85px;

  z-index:100;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:10px 15px;

  border-radius:10px;

  background:
    rgba(11,9,15,.95);

  border:1px solid #8c7048;

  box-shadow:0 5px 15px #000;

  font-size:11px;

  transition:
    .2s ease;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   LOOT POPUP
========================================================= */

#lootPopup{
  position:absolute;
  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.65);
}

#lootPopup.show{
  display:flex;
}

.loot-card{
  width:82%;
  max-width:320px;

  padding:20px;

  text-align:center;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #352d3c,
      #0f0d14
    );

  border:2px solid #987b4d;

  box-shadow:
    0 10px 35px #000;
}

.loot-card img{
  width:100px;
  height:100px;
  object-fit:contain;
}

.loot-title{
  color:#ffd76d;
  font-size:19px;
  font-weight:bold;
}

.loot-name{
  margin-top:7px;
  font-size:15px;
}

.loot-rarity{
  margin-top:4px;
  color:#a9ffce;
  font-size:11px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-height:650px){

  .topbar{
    min-height:58px;
  }

  .nav{
    height:60px;
  }

  .enemy-image{
    width:120px;
    height:120px;
  }

  .player-image{
    width:125px;
    height:135px;
  }

  .battle-controls{
    padding:5px;
  }

  .btn{
    min-height:42px;
  }
}
</style>
</head>

<body>

<div id="game">

<!-- =====================================================
     HOME
===================================================== -->

<section id="home" class="screen active">

  <div class="home-bg"></div>

  <div class="home-content">

    <img
      class="game-logo"
      src="./annomotion-105.png"
      alt="DARK LOOT">

    <div class="home-subtitle">
      DARK FANTASY IDLE HACK & SLASH
    </div>

    <button
      class="start-button"
      onclick="startGame()">
      GAME START
    </button>

    <button
      class="reset-button"
      onclick="resetGame()">
      セーブデータをリセット
    </button>

  </div>

</section>


<!-- =====================================================
     BATTLE
===================================================== -->

<section id="battle" class="screen">

  <div class="topbar">

    <div class="currency">
      <div>🪙 <span class="gold" id="goldBattle">0</span></div>
      <div>♦ <span class="ruby" id="rubyBattle">0</span></div>
    </div>

    <div class="title">
      DARK LOOT
    </div>

    <button
      class="btn"
      onclick="showScreen('home')">
      ⌂
    </button>

  </div>

  <div class="battle-area">

    <div class="battle-background"></div>
    <div class="battle-vignette"></div>

    <div class="wave-info">

      <div class="stage-name">
        DARK DUNGEON
      </div>

      <div class="wave-number">
        WAVE <span id="waveText">1</span>
      </div>

    </div>


    <div class="enemy-area">

      <img
        id="enemyImage"
        class="enemy-image"
        src="./annomotion-icon-7.png"
        alt="Enemy">

      <div
        class="enemy-name"
        id="enemyName">
        闇のゴブリン
      </div>

      <div class="hp-container">

        <div class="hp-label">

          <span>HP</span>

          <span>
            <span id="enemyHp">30</span>
            /
            <span id="enemyMaxHp">30</span>
          </span>

        </div>

        <div class="hp-bar">

          <div
            id="enemyHpFill"
            class="hp-fill">
          </div>

        </div>

      </div>

    </div>


    <div
      id="playerDamage"
      class="damage-number"
      style="display:none;">
      -5
    </div>


    <div class="player-area">

      <img
        id="playerImage"
        class="player-image"
        src="./annomotion-103.png"
        alt="Player">

      <div class="player-name">
        DARK KNIGHT
      </div>

    </div>

  </div>


  <div class="battle-controls">

    <button
      id="autoButton"
      class="btn green-btn"
      onclick="toggleAuto()">
      AUTO OFF
    </button>

    <button
      class="btn gold-btn"
      onclick="manualAttack()">
      ⚔️ ATTACK
    </button>

    <button
      class="btn"
      onclick="showScreen('inventory')">
      🎒 LOOT
    </button>

  </div>


  <nav class="nav">

    <button
      class="active"
      onclick="showScreen('battle')">
      <span>⚔️</span>
      戦闘
    </button>

    <button
      onclick="showScreen('equipment')">
      <span>🛡️</span>
      装備
    </button>

    <button
      onclick="showScreen('inventory')">
      <span>🎒</span>
      バッグ
    </button>

    <button
      onclick="showScreen('upgrade')">
      <span>⬆️</span>
      強化
    </button>

    <button
      onclick="showScreen('more')">
      <span>☰</span>
      その他
    </button>

  </nav>

</section>


<!-- =====================================================
     EQUIPMENT
===================================================== -->

<section id="equipment" class="screen sub-screen">

  <div class="sub-header">

    <button
      class="back"
      onclick="showScreen('battle')">
      ‹
    </button>

    装備

  </div>

  <div class="sub-content">

    <div class="panel equipment-character">

      <img
        src="./annomotion-103.png"
        alt="character">

      <div>
        戦闘力
        <strong id="powerText">100</strong>
      </div>

    </div>


    <div class="panel">

      <div class="panel-title">
        現在の装備

        転生すると現在の進行状況をリセットし、

        転生石は永久的な強化に使用できます。

        <br><br>

<div
  id="lootPopup">

    <img
      id="lootImage"
      src=""

      style="width:100%;margin-top:14px;"
      onclick="closeLoot()">
      GET
    </button>

  </div>

<div id="toast"></div>

</div>


<script>

/* =========================================================
   DARK LOOT
   GAME DATA
========================================================= */

const SAVE_KEY = "dark_loot_save_v3";


const defaultGame = {

  gold:500,
  ruby:20,

  wave:1,

  playerHp:100,
  playerMaxHp:100,

  attack:10,
  defense:5,

  power:100,

  auto:false,

  rebirthCount:0,
  rebirthStone:0,

  selectedItem:null,

  equipped:{
    weapon:null,
    helmet:null,
    armor:null,
    gloves:null,
    boots:null,
    ring:null,
    necklace:null,
    shield:null
  },

  inventory:[],

  upgrades:{
    attack:0,
    defense:0,
    hp:0
  }

};


let game = loadGame();

let enemy = null;

let autoTimer = null;
let enemyAttackTimer = null;


/* =========================================================
   IMAGE SET
========================================================= */

/*
  GitHubに入れた素材を使用。
  ファイル名が違う場合でもゲーム本体が止まらないよう、
  画像が読めなければ絵文字表示へフォールバックする。
*/

const ASSETS = {

  background:
    "./annomotion-102.png",

  logo:
    "./annomotion-105.png",

  player:
    "./annomotion-103.png",

  enemy:
    "./annomotion-icon-7.png",

  items:[
    "./annomotion-icon-7.png",
    "./annomotion-icon-7-1.png",
    "./annomotion-icon-7-2.png",
    "./annomotion-icon-7-3.png",
    "./annomotion-icon-7-4.png",
    "./annomotion-icon-8-2.png",
    "./annomotion-icon-8-3.png",
    "./annomotion-icon-8-4.png"
  ]

};


/* =========================================================
   ITEM DATABASE
========================================================= */

const ITEM_TYPES = [

  {
    name:"闇鉄の剣",
    type:"weapon",
    stat:12,
    price:60,
    rarity:"COMMON",
    image:ASSETS.items[0]
  },

  {
    name:"血染めの大剣",
    type:"weapon",
    stat:25,
    price:180,
    rarity:"RARE",
    image:ASSETS.items[1]
  },

  {
    name:"亡者の盾",
    type:"shield",
    stat:10,
    price:130,
    rarity:"RARE",
    image:ASSETS.items[2]
  },

  {
    name:"黒鉄の兜",
    type:"helmet",
    stat:8,
    price:90,
    rarity:"COMMON",
    image:ASSETS.items[3]
  },

  {
    name:"深淵の鎧",
    type:"armor",
    stat:20,
    price:250,
    rarity:"EPIC",
    image:ASSETS.items[4]
  },

  {
    name:"魔力の指輪",
    type:"ring",
    stat:14,
    price:210,
    rarity:"RARE",
    image:ASSETS.items[5]
  },

  {
    name:"血月の首飾り",
    type:"necklace",
    stat:30,
    price:400,
    rarity:"EPIC",
    image:ASSETS.items[6]
  },

  {
    name:"亡者のブーツ",
    type:"boots",
    stat:7,
    price:80,
    rarity:"COMMON",
    image:ASSETS.items[7]
  }

];


/* =========================================================
   SAVE / LOAD
========================================================= */

function loadGame(){

  try{

    const saved =
      localStorage.getItem(SAVE_KEY);

    if(!saved){

      return structuredClone(defaultGame);

    }

    const data =
      JSON.parse(saved);

    return {

      ...structuredClone(defaultGame),

      ...data,

      equipped:{
        ...defaultGame.equipped,
        ...(data.equipped || {})
      },

      upgrades:{
        ...defaultGame.upgrades,
        ...(data.upgrades || {})
      },

      inventory:
        Array.isArray(data.inventory)
          ? data.inventory
          : []

    };

  }catch(e){

    return structuredClone(defaultGame);

  }

}


function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(game)
  );

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.remove("active");
    });

  const target =
    document.getElementById(id);

  if(target){

    target.classList.add("active");

  }

  if(id==="battle"){
    updateBattleUI();
  }

  if(id==="equipment"){
    renderEquipment();
  }

  if(id==="inventory"){
    renderInventory();
  }

  if(id==="upgrade"){
    renderUpgrade();
  }

  if(id==="ranking"){
    renderRanking();
  }

  if(id==="rebirth"){
    updateRebirth();
  }

}


/* =========================================================
   START
========================================================= */

function startGame(){

  showScreen("battle");

  createEnemy();

  startEnemyAttack();

  if(game.auto){

    startAuto();

  }

}


/* =========================================================
   ENEMY
========================================================= */

function createEnemy(){

  const scale =
    1 +
    Math.max(0,game.wave-1)*0.18;

  const baseHp =
    Math.floor(30 * scale);

  const baseAttack =
    Math.max(
      2,
      Math.floor(
        3 * scale
      )
    );

  const names = [

    "闇のゴブリン",
    "腐敗兵",
    "血狼",
    "黒騎士",
    "深淵の魔獣",
    "奈落の番人"

  ];

  const name =
    names[
      Math.min(
        names.length-1,
        Math.floor(
          (game.wave-1)/3
        )
      )
    ];

  enemy = {

    name,

    maxHp:baseHp,

    hp:baseHp,

    attack:baseAttack

  };

  updateBattleUI();

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function manualAttack(){

  attackEnemy();

}


function attackEnemy(){

  if(!enemy) return;

  const damage =
    Math.max(
      1,
      Math.floor(
        game.attack *
        (0.9 + Math.random()*0.25)
      )
    );

  enemy.hp -= damage;

  showDamage(
    damage,
    "enemy"
  );

  const img =
    document.getElementById(
      "enemyImage"
    );

  img.classList.remove("hit");

  void img.offsetWidth;

  img.classList.add("hit");

  updateBattleUI();

  if(enemy.hp<=0){

    enemyDefeated();

  }

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function startEnemyAttack(){

  clearInterval(
    enemyAttackTimer
  );

  enemyAttackTimer =
    setInterval(()=>{

      if(
        !enemy ||
        !document
          .getElementById("battle")
          .classList.contains("active")
      ){

        return;

      }

      enemyAttack();

    },2600);

}


function enemyAttack(){

  const damage =
    Math.max(
      1,
      enemy.attack -
      game.defense
    );

  game.playerHp -= damage;

  if(game.playerHp<0){

    game.playerHp=0;

  }

  showDamage(
    damage,
    "player"
  );

  updateBattleUI();

  if(game.playerHp<=0){

    playerDefeated();

  }

}


/* =========================================================
   PLAYER DEFEATED
========================================================= */

function playerDefeated(){

  stopAuto();

  game.playerHp =
    game.playerMaxHp;

  game.gold =
    Math.max(
      0,
      Math.floor(
        game.gold*0.92
      )
    );

  saveGame();

  toast(
    "力尽きた……。少しだけコインを失いました"
  );

  setTimeout(()=>{

    createEnemy();

  },600);

}


/* =========================================================
   ENEMY DEFEATED
========================================================= */

function enemyDefeated(){

  game.gold +=
    Math.floor(
      12 +
      game.wave*4
    );

  if(Math.random()<0.18){

    game.ruby +=1;

  }

  const lootChance =
    Math.min(
      0.55,
      0.18 +
      game.wave*0.01
    );

  if(Math.random()<lootChance){

    dropLoot();

  }

  game.wave++;

  game.playerHp =
    Math.min(
      game.playerMaxHp,
      game.playerHp+12
    );

  saveGame();

  createEnemy();

}


/* =========================================================
   AUTO
========================================================= */

function toggleAuto(){

  game.auto =
    !game.auto;

  saveGame();

  updateAutoButton();

  if(game.auto){

    startAuto();

    toast(
      "オート攻撃 ON"
    );

  }else{

    stopAuto();

    toast(
      "オート攻撃 OFF"
    );

  }

}


function startAuto(){

  stopAuto();

  autoTimer =
    setInterval(()=>{

      if(
        enemy &&
        enemy.hp>0 &&
        document
          .getElementById("battle")
          .classList.contains("active")
      ){

        attackEnemy();

      }

    },900);

}


function stopAuto(){

  if(autoTimer){

    clearInterval(
      autoTimer
    );

    autoTimer=null;

  }

}


function updateAutoButton(){

  const btn =
    document.getElementById(
      "autoButton"
    );

  if(game.auto){

    btn.textContent =
      "AUTO ON";

    btn.classList.add(
      "auto-on"
    );

  }else{

    btn.textContent =
      "AUTO OFF";

    btn.classList.remove(
      "auto-on"
    );

  }

}


/* =========================================================
   LOOT
========================================================= */

function dropLoot(){

  const item =
    ITEM_TYPES[
      Math.floor(
        Math.random()*
        ITEM_TYPES.length
      )
    ];

  const newItem = {

    ...item,

    id:
      Date.now() +
      Math.random(),

    level:1

  };

  game.inventory.push(
    newItem
  );

  showLoot(
    newItem
  );

}


function showLoot(item){

  document
    .getElementById(
      "lootImage"
    )
    .src =
      item.image;

  document
    .getElementById(
      "lootName"
    )
    .textContent =
      item.name;

  document
    .getElementById(
      "lootRarity"
    )
    .textContent =
      item.rarity;

  document
    .getElementById(
      "lootPopup"
    )
    .classList.add("show");

}


function closeLoot(){

  document
    .getElementById(
      "lootPopup"
    )
    .classList.remove("show");

  saveGame();

}


/* =========================================================
   INVENTORY
========================================================= */

function renderInventory(){

  const grid =
    document.getElementById(
      "inventoryGrid"
    );

  grid.innerHTML="";

  if(
    game.inventory.length===0
  ){

    grid.innerHTML=
      `<div style="grid-column:1/-1;text-align:center;color:#999;padding:30px">
        アイテムがありません
      </div>`;

    return;

  }

  game.inventory
    .forEach(item=>{

      const div =
        document.createElement(
          "button"
        );

      div.className =
        "inventory-item";

      div.innerHTML=`

        <img
          src="${item.image}"
          alt="">

        <span style="font-size:8px;margin-top:3px">
          ${item.name}
        </span>

        ${
          item.count
          ?
          `<span class="item-count">
            ×${item.count}
          </span>`
          :
          ""
        }

      `;

      div.onclick=()=>{

        selectItem(
          item.id
        );

      };

      grid.appendChild(
        div
      );

    });

}


function selectItem(id){

  const item =
    game.inventory.find(
      x=>x.id===id
    );

  if(!item) return;

  game.selectedItem=id;

  const panel =
    document.getElementById(
      "itemDetailPanel"
    );

  panel.style.display =
    "block";

  document
    .getElementById(
      "detailImage"
    )
    .src =
      item.image;

  document
    .getElementById(
      "detailName"
    )
    .textContent =
      item.name;

  document
    .getElementById(
      "detailStat"
    )
    .textContent =
      `${item.type} / +${item.stat} / ${item.rarity}`;

}


/* =========================================================
   EQUIP
========================================================= */

function equipSelected(){

  if(
    !game.selectedItem
  ){

    toast(
      "アイテムを選択してください"
    );

    return;

  }

  const item =
    game.inventory.find(
      x=>
        x.id===
        game.selectedItem
    );

  if(!item) return;

  const slot =
    item.type;

  if(
    !Object.prototype.hasOwnProperty.call(
      game.equipped,
      slot
    )
  ){

    toast(
      "この装備は装備できません"
    );

    return;

  }

  game.equipped[slot]=item.id;

  recalculateStats();

  saveGame();

  renderInventory();

  toast(
    `${item.name} を装備中にしました`
  );

}


function recalculateStats(){

  let attack=10;
  let defense=5;

  Object.values(
    game.equipped
  )
  .forEach(id=>{

    if(!id) return;

    const item =
      game.inventory.find(
        x=>x.id===id
      );

    if(!item) return;

    if(
      item.type==="weapon"
    ){

      attack +=
        item.stat;

    }else{

      defense +=
        Math.floor(
          item.stat/2
        );

    }

  });

  attack +=
    game.upgrades.attack*3;

  defense +=
    game.upgrades.defense*2;

  game.attack=attack;
  game.defense=defense;

  game.playerMaxHp =
    100 +
    game.upgrades.hp*15;

  game.playerHp =
    Math.min(
      game.playerHp,
      game.playerMaxHp
    );

  game.power =
    attack*5 +
    defense*4 +
    game.playerMaxHp;

}


/* =========================================================
   EQUIPMENT SCREEN
========================================================= */

function renderEquipment(){

  recalculateStats();

  document
    .getElementById(
      "powerText"
    )
    .textContent =
      game.power;

  const container =
    document.getElementById(
      "equipmentSlots"
    );

  container.innerHTML="";

  const slots = [

    ["weapon","⚔️","武器"],
    ["helmet","🪖","兜"],
    ["armor","🛡️","鎧"],
    ["gloves","🧤","手甲"],
    ["boots","🥾","ブーツ"],
    ["ring","💍","指輪"],
    ["necklace","📿","首飾り"],
    ["shield","🛡️","盾"]

  ];

  slots.forEach(
    ([type,emoji,name])=>{

      const id =
        game.equipped[type];

      const item =
        game.inventory.find(
          x=>x.id===id
        );

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "equipment-slot";

      if(item){

        div.innerHTML=`

          <img
            class="equipment-icon"
            src="${item.image}"
            alt="">

          <div
            class="equipment-slot-name">
            ${item.name}
          </div>

          <div
            class="equipped-label">
            装備中
          </div>

        `;

      }else{

        div.innerHTML=`

          <div
            style="font-size:30px">
            ${emoji}
          </div>

          <div
            class="equipment-slot-name">
            ${name}
          </div>

          <div
            style="font-size:8px;color:#777">
            未装備
          </div>

        `;

      }

      container.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   SELL
========================================================= */

function sellSelected(){

  if(
    !game.selectedItem
  ) return;

  const index =
    game.inventory.findIndex(
      x=>
        x.id===
        game.selectedItem
    );

  if(index===-1)
    return;

  const item =
    game.inventory[index];

  const isEquipped =
    Object.values(
      game.equipped
    ).includes(
      item.id
    );

  if(isEquipped){

    toast(
      "装備中のアイテムは売却できません"
    );

    return;

  }

  const price =
    item.price ||
    10;

  game.gold +=
    price;

  game.inventory.splice(
    index,
    1
  );

  game.selectedItem=null;

  document
    .getElementById(
      "itemDetailPanel"
    )
    .style.display="none";

  saveGame();

  renderInventory();

  toast(
    `${price}コインで売却しました`
  );

}


/* =========================================================
   UPGRADE
========================================================= */

function renderUpgrade(){

  document
    .getElementById(
      "goldUpgrade"
    )
    .textContent =
      game.gold.toLocaleString();

  const list =
    document.getElementById(
      "upgradeList"
    );

  list.innerHTML="";

  const upgrades=[

    {
      key:"attack",
      icon:"⚔️",
      name:"攻撃力",
      description:
        `現在 +${game.upgrades.attack*3}`,
      cost:
        100+
        game.upgrades.attack*80
    },

    {
      key:"defense",
      icon:"🛡️",
      name:"防御力",
      description:
        `現在 +${game.upgrades.defense*2}`,
      cost:
        100+
        game.upgrades.defense*80
    },

    {
      key:"hp",
      icon:"❤️",
      name:"最大HP",
      description:
        `現在 +${game.upgrades.hp*15}`,
      cost:
        100+
        game.upgrades.hp*100
    }

  ];

  upgrades.forEach(
    up=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "upgrade-row";

      row.innerHTML=`

        <div
          class="upgrade-icon">
          ${up.icon}
        </div>

        <div>

          <div class="upgrade-name">
            ${up.name}
          </div>

          <div class="upgrade-stat">
            ${up.description}
          </div>

          <div class="upgrade-stat">
            🪙 ${up.cost}
          </div>

        </div>

        <button
          class="upgrade-button"
          onclick="upgradeStat('${up.key}',${up.cost})">
          強化
        </button>

      `;

      list.appendChild(
        row
      );

    }
  );

}


function upgradeStat(
  key,
  cost
){

  if(
    game.gold<cost
  ){

    toast(
      "コインが足りません"
    );

    return;

  }

  game.gold -=
    cost;

  game.upgrades[key]++;

  recalculateStats();

  saveGame();

  renderUpgrade();

  updateBattleUI();

  toast(
    "強化しました！"
  );

}


/* =========================================================
   RANKING
========================================================= */

function renderRanking(){

  const list =
    document.getElementById(
      "rankingList"
    );

  const rows=[

    ["1","DarkLord","9,820,400"],
    ["2","AbyssWalker","8,441,200"],
    ["3","BloodKnight","7,912,800"],
    ["4","Nightmare","6,440,300"],
    ["5","SoulEater","5,981,700"],
    [
      "—",
      "あなた",
      game.power.toLocaleString()
    ]

  ];

  list.innerHTML="";

  rows.forEach(
    row=>{

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "ranking-row";

      div.innerHTML=`

        <div
          class="rank-number">
          ${row[0]}
        </div>

        <div
          class="rank-name">
          ${row[1]}
        </div>

        <div
          class="rank-power">
          ${row[2]}
        </div>

      `;

      list.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   REBIRTH
========================================================= */

function updateRebirth(){

  document
    .getElementById(
      "rebirthCount"
    )
    .textContent =
      game.rebirthCount;

}


function rebirth(){

  if(
    game.wave<10
  ){

    toast(
      "WAVE 10到達で転生できます"
    );

    return;

  }

  game.rebirthCount++;

  game.rebirthStone +=
    Math.floor(
      game.wave/5
    );

  game.wave=1;

  game.gold=500;

  game.ruby=20;

  game.inventory=[];

  game.equipped={
    weapon:null,
    helmet:null,
    armor:null,
    gloves:null,
    boots:null,
    ring:null,
    necklace:null,
    shield:null
  };

  game.upgrades={
    attack:0,
    defense:0,
    hp:0
  };

  recalculateStats();

  saveGame();

  createEnemy();

  showScreen("battle");

  toast(
    "転生しました！永久成長の力を獲得！"
  );

}


/* =========================================================
   BATTLE UI
========================================================= */

function updateBattleUI(){

  document
    .getElementById(
      "goldBattle"
    )
    .textContent =
      game.gold.toLocaleString();

  document
    .getElementById(
      "rubyBattle"
    )
    .textContent =
      game.ruby.toLocaleString();

  if(!enemy)
    return;

  document
    .getElementById(
      "waveText"
    )
    .textContent =
      game.wave;

  document
    .getElementById(
      "enemyName"
    )
    .textContent =
      enemy.name;

  document
    .getElementById(
      "enemyHp"
    )
    .textContent =
      Math.max(
        0,
        enemy.hp
      );

  document
    .getElementById(
      "enemyMaxHp"
    )
    .textContent =
      enemy.maxHp;

  document
    .getElementById(
      "enemyHpFill"
    )
    .style.width =
      `${
        Math.max(
          0,
          enemy.hp/enemy.maxHp*100
        )
      }%`;

  updateAutoButton();

}


/* =========================================================
   DAMAGE
========================================================= */

function showDamage(
  amount,
  target
){

  const el =
    document.createElement(
      "div"
    );

  el.className =
    "damage-number";

  el.textContent =
    `-${amount}`;

  const area =
    document.querySelector(
      ".battle-area"
    );

  const rect =
    area.getBoundingClientRect();

  if(target==="enemy"){

    el.style.left =
      "50%";

    el.style.top =
      "35%";

  }else{

    el.style.left =
      "50%";

    el.style.bottom =
      "25%";

    el.style.color =
      "#ff8a8a";

  }

  area.appendChild(
    el
  );

  setTimeout(
    ()=>el.remove(),
    850
  );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

  if(
    !confirm(
      "セーブデータをリセットしますか？"
    )
  ){

    return;

  }

  localStorage.removeItem(
    SAVE_KEY
  );

  game =
    loadGame();

  enemy=null;

  stopAuto();

  showScreen(
    "home"
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

recalculateStats();

updateAutoButton();

renderEquipment();

renderInventory();

renderUpgrade();

renderRanking();

updateRebirth();

</script>

</body>
</html>
