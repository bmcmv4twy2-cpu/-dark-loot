<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DARK LOOT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:#fff;
  font-family:
    Arial,
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:520px;
  margin:auto;
  overflow:hidden;
  background:#09080c;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  overflow:hidden;
}

.screen.active{
  display:flex;
}

/* =========================
   共通
========================= */

.btn{
  min-height:46px;
  padding:8px 12px;
  border-radius:11px;

  background:
    linear-gradient(
      180deg,
      #514756,
      #201b26
    );

  border:1px solid #806847;

  box-shadow:
    inset 0 1px rgba(255,255,255,.12),
    0 3px 7px #000;

  font-weight:bold;
}

.btn:active{
  transform:translateY(2px);
}

.gold-btn{
  background:
    linear-gradient(
      180deg,
      #8c6a3e,
      #382617
    );

  border-color:#d0a65e;
}

.red-btn{
  background:
    linear-gradient(
      180deg,
      #783c47,
      #30171d
    );

  border-color:#b65b69;
}

.green-btn{
  background:
    linear-gradient(
      180deg,
      #34775d,
      #143126
    );

  border-color:#66c39a;
}

.purple-btn{
  background:
    linear-gradient(
      180deg,
      #704b83,
      #281a31
    );

  border-color:#b47bce;
}

.gold{
  color:#ffd866;
}

.ruby{
  color:#ff668b;
}

.purple{
  color:#c98cff;
}

.cyan{
  color:#79e4ff;
}

.muted{
  color:#9993a0;
}

/* =========================
   ホーム
========================= */

#home{
  justify-content:center;
  align-items:center;
  text-align:center;
}

.home-bg{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.75)
    ),
    url("./annomotion-102.png")
    center/cover no-repeat;

  filter:saturate(.85);
}

.home-bg::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 15%,
      rgba(0,0,0,.8)
    );
}

.home-content{
  position:relative;
  z-index:5;

  width:90%;
  max-width:390px;
}

.game-logo{
  width:92%;
  max-height:160px;
  object-fit:contain;

  filter:
    drop-shadow(0 5px 10px #000)
    drop-shadow(
      0 0 20px
      rgba(180,100,255,.25)
    );

  margin-bottom:18px;
}

.home-subtitle{
  color:#c7b89c;
  letter-spacing:3px;
  font-size:11px;
  margin-bottom:22px;
}

.start-button{
  width:100%;
  min-height:64px;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      #967343,
      #382617
    );

  border:2px solid #d1a75f;

  box-shadow:
    inset 0 2px rgba(255,255,255,.15),
    0 6px 20px #000;

  font-size:19px;
  font-weight:bold;
  letter-spacing:3px;
}

.reset-button{
  margin-top:12px;
  background:rgba(20,18,24,.85);
  border:1px solid #4d4551;
  padding:8px 15px;
  border-radius:9px;
  font-size:10px;
}

/* =========================
   TOP
========================= */

.topbar{
  position:relative;
  z-index:20;

  min-height:66px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:7px;
  padding:7px 8px;

  background:
    linear-gradient(
      180deg,
      #302a36,
      #0d0b10
    );

  border-bottom:2px solid #745b38;

  box-shadow:
    0 4px 15px #000;
}

.logo-mini{
  width:82px;
  height:46px;
  object-fit:contain;

  filter:
    drop-shadow(
      0 3px 5px #000
    );
}

.currency{
  display:flex;
  gap:5px;
  margin-left:auto;
}

.currency-box{
  min-width:78px;

  padding:6px 8px;

  border-radius:9px;

  background:
    linear-gradient(
      180deg,
      #29242e,
      #111016
    );

  border:1px solid #675437;

  box-shadow:
    inset 0 1px rgba(255,255,255,.1),
    0 2px 7px #000;

  font-size:11px;
  text-align:center;
}

/* =========================
   BATTLE
========================= */

#battle{
  background:#07070a;
}

.battle-area{
  position:relative;
  flex:1;
  overflow:hidden;
}

.battle-background{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.12),
      rgba(0,0,0,.68)
    ),
    url("./annomotion-103.png")
    center/cover no-repeat;
}

.battle-background::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 18%,
      rgba(0,0,0,.75)
    );
}

/* WAVE */

.wave-info{
  position:relative;
  z-index:5;

  text-align:center;

  padding-top:7px;

  font-size:11px;

  color:#cfc2aa;
}

.wave-number{
  display:block;

  margin-top:2px;

  color:#ffd36a;

  font-size:17px;
  font-weight:bold;
}

/* ENEMY */

.enemy-area{
  position:relative;
  z-index:5;

  text-align:center;

  margin-top:2px;
}

.enemy-image{
  width:165px;
  height:165px;

  object-fit:contain;

  filter:
    drop-shadow(0 10px 12px #000)
    drop-shadow(
      0 0 18px
      rgba(190,30,50,.35)
    );

  animation:
    enemyFloat
    2.4s
    ease-in-out
    infinite;
}

@keyframes enemyFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }
}

.enemy-image.hit{
  animation:
    enemyHit
    .18s
    linear;
}

@keyframes enemyHit{
  0%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-10px);
  }

  50%{
    transform:translateX(10px);
  }

  75%{
    transform:translateX(-6px);
  }

  100%{
    transform:translateX(0);
  }
}

.enemy-name{
  font-size:15px;

  font-weight:bold;

  text-shadow:
    0 2px 5px #000;
}

/* HP */

.hp-container{
  width:78%;
  max-width:320px;

  margin:6px auto;
}

.hp-label{
  display:flex;
  justify-content:space-between;

  font-size:10px;
}

.hp-bar{
  height:13px;

  margin-top:4px;

  border-radius:20px;

  overflow:hidden;

  background:#160f14;

  border:1px solid #72454c;

  box-shadow:
    inset 0 2px 4px #000;
}

.hp-fill{
  height:100%;

  width:100%;

  background:
    linear-gradient(
      180deg,
      #ff6c72,
      #a50d29
    );

  transition:
    width .12s;
}

/* PLAYER */

.player-area{
  position:absolute;

  left:0;
  right:0;

  bottom:4px;

  z-index:5;

  text-align:center;
}

.player-image{
  width:155px;
  height:155px;

  object-fit:contain;

  filter:
    drop-shadow(0 12px 15px #000);
}

.player-name{
  font-size:11px;
  color:#ddd;
}

/* =========================
   BATTLE CONTROL
========================= */

.battle-controls{
  position:relative;
  z-index:20;

  display:grid;

  grid-template-columns:
    1fr
    1.35fr
    1fr;

  gap:6px;

  padding:7px;

  background:
    linear-gradient(
      180deg,
      rgba(29,25,34,.98),
      rgba(7,6,10,.98)
    );

  border-top:2px solid #665139;
}

.battle-controls .btn{
  min-height:51px;
  font-size:12px;
}

.auto-on{
  background:
    linear-gradient(
      180deg,
      #39795f,
      #143428
    ) !important;

  border-color:#65c49a !important;
}

/* =========================
   DAMAGE
========================= */

.damage-number{
  position:absolute;

  z-index:50;

  color:#ff6969;

  font-size:24px;

  font-weight:bold;

  text-shadow:
    0 2px 5px #000;

  animation:
    damageUp
    .75s
    ease-out
    forwards;

  pointer-events:none;
}

@keyframes damageUp{
  0%{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-65px)
      scale(1.2);
  }
}

.loot-popup{
  position:absolute;

  z-index:60;

  left:50%;
  top:45%;

  transform:
    translate(-50%,-50%);

  padding:9px 14px;

  border-radius:10px;

  background:
    rgba(20,16,25,.94);

  border:1px solid #d0a75f;

  color:#ffd76b;

  font-weight:bold;

  animation:
    lootPopup
    1s
    ease-out
    forwards;

  pointer-events:none;
}

@keyframes lootPopup{
  0%{
    opacity:0;
    transform:
      translate(-50%,-20%)
      scale(.7);
  }

  20%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-120%)
      scale(1.05);
  }
}

/* =========================
   NAV
========================= */

.nav{
  position:relative;
  z-index:30;

  height:67px;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  background:
    linear-gradient(
      180deg,
      #29242f,
      #0e0c12
    );

  border-top:2px solid #705637;
}

.nav button{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  background:transparent;

  color:#9f99a6;

  font-size:9px;
}

.nav button span{
  font-size:21px;
}

.nav button.active{
  color:#ffd86b;
}

/* =========================
   SUB SCREEN
========================= */

.sub-screen{
  background:
    linear-gradient(
      180deg,
      #141019,
      #07070a
    );
}

.sub-header{
  position:relative;
  z-index:10;

  height:62px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #302a36,
      #111016
    );

  border-bottom:2px solid #6c5639;

  font-weight:bold;

  letter-spacing:2px;
}

.back{
  position:absolute;

  left:9px;

  width:40px;
  height:38px;

  border-radius:10px;

  background:#211c27;

  border:1px solid #745c3d;

  font-size:20px;
}

.sub-content{
  flex:1;

  overflow-y:auto;

  padding:9px;
}

/* =========================
   PANEL
========================= */

.panel{
  margin-bottom:9px;

  padding:11px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(51,44,59,.97),
      rgba(14,12,18,.98)
    );

  border:1px solid #7d6748;

  box-shadow:
    inset 0 1px rgba(255,255,255,.07),
    0 4px 12px #000;
}

.panel-title{
  margin-bottom:9px;

  color:#f0cc78;

  font-weight:bold;

  font-size:14px;
}

/* =========================
   EQUIPMENT
========================= */

.equipment-character{
  text-align:center;
}

.equipment-character img{
  width:145px;
  height:155px;

  object-fit:contain;

  filter:
    drop-shadow(0 8px 10px #000);
}

.equipment-slots{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;
}

.equipment-slot{
  min-height:92px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      #312a38,
      #121016
    );

  border:1px solid #62533f;

  font-size:9px;
}

.equipment-icon{
  width:48px;
  height:48px;

  object-fit:contain;

  filter:
    drop-shadow(0 3px 4px #000);
}

.equipped-label{
  margin-top:4px;

  padding:2px 6px;

  border-radius:5px;

  background:#123b2c;

  border:1px solid #3d8b68;

  color:#7dffc1;

  font-size:8px;
}

/* =========================
   INVENTORY
========================= */

.inventory-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;
}

.inventory-item{
  min-height:76px;

  border-radius:9px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      145deg,
      #302936,
      #111016
    );

  border:1px solid #574a3d;

  text-align:center;

  font-size:8px;
}

.inventory-item img{
  width:43px;
  height:43px;

  object-fit:contain;
}

/* =========================
   ITEM ROW
========================= */

.item-row{
  display:flex;

  align-items:center;

  gap:8px;

  padding:8px;

  margin-bottom:6px;

  border-radius:9px;

  background:#17131c;

  border:1px solid #4b4050;
}

.item-row img{
  width:48px;
  height:48px;

  object-fit:contain;
}

.item-info{
  flex:1;
}

.item-name{
  font-size:12px;
  font-weight:bold;
}

.item-stats{
  margin-top:3px;

  font-size:9px;

  color:#aaa;
}

.item-actions{
  display:flex;

  flex-direction:column;

  gap:4px;
}

.item-actions button{
  min-height:31px;

  padding:4px 7px;

  font-size:9px;
}

/* =========================
   STATS
========================= */

.stats-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:6px;
}

.stat-box{
  padding:8px;

  border-radius:8px;

  background:#17131c;

  border:1px solid #4c4052;

  text-align:center;

  font-size:10px;
}

.stat-box b{
  display:block;

  margin-top:3px;

  font-size:15px;
}

/* =========================
   UPGRADE
========================= */

.upgrade-row{
  display:grid;

  grid-template-columns:
    1fr
    auto;

  align-items:center;

  gap:7px;

  padding:10px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.upgrade-row:last-child{
  border-bottom:0;
}

.upgrade-name{
  margin:0;

  font-size:13px;
}

.upgrade-description{
  margin:3px 0 0;

  font-size:9px;

  color:#aaa;
}

/* =========================
   RANKING
========================= */

.rank-row{
  display:flex;

  align-items:center;

  gap:8px;

  padding:9px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.rank-row:last-child{
  border-bottom:0;
}

.rank-number{
  width:28px;

  text-align:center;

  color:#ffd76b;

  font-weight:bold;
}

.rank-name{
  flex:1;

  font-size:11px;
}

.rank-wave{
  font-size:10px;

  color:#aaa;
}

.my-rank{
  background:#332617;

  border-radius:8px;
}

/* =========================
   REBIRTH
========================= */

.rebirth-box{
  text-align:center;

  padding:15px;
}

.rebirth-number{
  font-size:36px;

  color:#c98cff;

  font-weight:bold;
}

.rebirth-description{
  color:#aaa;

  font-size:10px;

  line-height:1.6;

  margin:10px 0 15px;
}

/* =========================
   NOTICE
========================= */

.notice{
  position:absolute;

  z-index:100;

  left:50%;
  top:18%;

  width:85%;

  transform:
    translateX(-50%);

  padding:11px 13px;

  border-radius:11px;

  background:
    rgba(21,17,28,.98);

  border:1px solid #a37ac4;

  box-shadow:
    0 5px 18px #000;

  text-align:center;

  font-size:12px;

  animation:
    noticeAnim
    1.8s
    forwards;
}

@keyframes noticeAnim{
  0%{
    opacity:0;

    transform:
      translate(-50%,-10px);
  }

  12%,80%{
    opacity:1;

    transform:
      translate(-50%,0);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-10px);
  }
}
</style>
</head>

<body>

<div id="game">

<!-- =========================
     HOME
========================= -->

<section
  id="home"
  class="screen active">

  <div class="home-bg"></div>

  <div class="home-content">

    <img
      id="gameLogo"
      class="game-logo"
      src="./annomotion-text-to-vector-13.svg">

    <div class="home-subtitle">
      DARK FANTASY • IDLE HACK & SLASH RPG
    </div>

    <button
      class="start-button"
      onclick="startGame()">

      ⚔️ 冒険をはじめる

    </button>

    <br>

    <button
      class="reset-button"
      onclick="resetSave()">

      セーブデータをリセット

    </button>

  </div>

</section>


<!-- =========================
     BATTLE
========================= -->

<section
  id="battle"
  class="screen">

  <div class="topbar">

    <img
      class="logo-mini"
      src="./annomotion-text-to-vector-13.svg">

    <div class="currency">

      <div class="currency-box gold">
        🪙 <span id="goldTop">0</span>
      </div>

      <div class="currency-box ruby">
        ♦ <span id="rubyTop">0</span>
      </div>

    </div>

  </div>


  <div class="battle-area">

    <div class="battle-background"></div>


    <div class="wave-info">

      WAVE

      <span
        id="waveNumber"
        class="wave-number">

        1

      </span>

    </div>


    <div
      id="enemyArea"
      class="enemy-area">

      <img
        id="enemyImage"
        class="enemy-image">

      <div
        id="enemyName"
        class="enemy-name">

        闇の魔物

      </div>


      <div class="hp-container">

        <div class="hp-label">

          <span>ENEMY HP</span>

          <span id="enemyHpText">
            0 / 0
          </span>

        </div>

        <div class="hp-bar">

          <div
            id="enemyHpFill"
            class="hp-fill">
          </div>

        </div>

      </div>

    </div>


    <div class="player-area">

      <img
        id="playerImage"
        class="player-image">

      <div class="player-name">
        DARK KNIGHT
      </div>

    </div>

    <div id="effects"></div>

  </div>


  <div class="battle-controls">

    <button
      class="btn"
      onclick="manualAttack()">

      ⚔️ 攻撃

    </button>

    <button
      id="autoButton"
      class="btn gold-btn"
      onclick="toggleAuto()">

      AUTO OFF

    </button>

    <button
      class="btn"
      onclick="showScreen('equipment')">

      🛡 装備

    </button>

  </div>


  <div class="nav">

    <button
      class="active"
      onclick="showScreen('battle')">

      <span>⚔</span>
      戦闘

    </button>

    <button
      onclick="showScreen('equipment')">

      <span>🛡</span>
      装備

    </button>

    <button
      onclick="showScreen('inventory')">

      <span>🎒</span>
      所持品

    </button>

    <button
      onclick="showScreen('upgrade')">

      <span>⬆</span>
      強化

    </button>

    <button
      onclick="showScreen('menu')">

      <span>☰</span>
      メニュー

    </button>

  </div>

</section>


<!-- =========================
     EQUIPMENT
========================= -->

<section
  id="equipment"
  class="screen sub-screen">

  <div class="sub-header">

    <button
      class="back"
      onclick="showScreen('battle')">

      ‹

    </button>

    装備

  </div>


  <div class="sub-content">

    <div class="panel">

      <div class="panel-title">
        現在のキャラクター
      </div>

      <div
        class="equipment-character">

        <img id="equipmentCharacter">

      </div>

    </div>


    <div class="panel">

      <div class="panel-title">
        装備中
      </div>

      <div
        id="equippedSlots"
        class="equipment-slots">
      </div>

    </div>


    <div class="panel">

      <div class="panel-title">
        所持装備
      </div>

      <div id="equipmentList"></div>

    </div>

  </div>

</section>


<!-- =========================
     INVENTORY
========================= -->

<section
  id="inventory"
  class="screen sub-screen">

  <div class="sub-header">

    <button
      class="back"

      <div class="panel-title">

      </div>

      <div class="stats-grid">

        <div class="stat-box">
          攻撃
          <b id="attackStat">0</b>
        </div>

        <div class="stat-box">
          防御
          <b id="defenseStat">0</b>
        </div>

        <div class="stat-box">
          HP
          <b id="hpStat">0</b>
        </div>

      </div>

    </div>


    <div

      class="panel">
    </div>

  </div>

</section>


<!-- =========================
     MENU
========================= -->

<section
  id="menu"
  class="screen sub-screen">

  <div class="sub-header">

    <button
      class="back"
      onclick="showScreen('battle')">

      ‹

    </button>

    メニュー

  </div>


  <div class="sub-content">


    <!-- RANKING -->

    <div class="panel">

      <div class="panel-title">
        🏆 ランキング
      </div>

      <div id="rankingList"></div>

    </div>


    <!-- REBIRTH -->

    <div class="panel">

      <div class="panel-title">
        🔄 転生
      </div>

      <div class="rebirth-box">

        <div
          id="rebirthCount"
          class="rebirth-number">

          0

        </div>

        <div class="rebirth-description">

          一定WAVEまで進むと転生できます。<br>

          転生するとWAVEは1に戻りますが、<br>

          ルビーと永久ボーナスを獲得できます。

        </div>

        <button
          class="btn purple-btn"
          onclick="rebirth()">

          🔄 転生する

        </button>

      </div>

    </div>


    <!-- SAVE -->

    <div class="panel">

      <div class="panel-title">
        💾 セーブ
      </div>

      <button
        class="btn green-btn"
        style="width:100%"
        onclick="saveGame();notice('ゲームをセーブしました')">

        ゲームをセーブ

      </button>

    </div>

  </div>

</section>

</div>


<script>

/* =========================================================
   DARK LOOT
   GAME DATA
========================================================= */

const ASSET = "./";


const enemyImages = [

  "annomotion-icon-7-1.png",
  "annomotion-icon-7-2.png",
  "annomotion-icon-7-3.png",
  "annomotion-icon-7-4.png",

  "annomotion-icon-8-2.png",
  "annomotion-icon-8-3.png",
  "annomotion-icon-8-4.png",

  "annomotion-icon-9-1.png",
  "annomotion-icon-9-2.png",
  "annomotion-icon-9-3.png",
  "annomotion-icon-9-4.png"

];


const equipmentImages = [

  "annomotion-icon-11-1.png",
  "annomotion-icon-11-2.png",
  "annomotion-icon-11-3.png",
  "annomotion-icon-11-4.png",

  "annomotion-icon-12-1.png",
  "annomotion-icon-12-2.png",
  "annomotion-icon-12-3.png",
  "annomotion-icon-12-4.png",

  "annomotion-icon-13-1.png"

];


const enemyNames = [

  "影喰らい",
  "腐敗兵",
  "血塗れの獣",
  "夜鬼",
  "呪われた兵士",
  "深淵の番人",
  "黒炎魔",
  "冥界兵",
  "漆黒の魔獣",
  "終焉の騎士",
  "深淵王"

];


const equipmentNames = [

  "影の剣",
  "黒鉄の剣",
  "血月の刃",
  "深淵の大剣",

  "黒鉄鎧",
  "亡者の鎧",
  "深淵の鎧",
  "魔王の鎧",

  "深淵の指輪"

];


const rarityList = [
  "N",
  "N",
  "R",
  "R",
  "SR",
  "SR",
  "SSR"
];


let game = {

  gold:0,

  ruby:10,

  wave:1,

  bestWave:1,

  rebirth:0,

  attack:18,

  defense:8,

  maxHp:120,

  hp:120,

  attackLv:0,

  defenseLv:0,

  hpLv:0,

  auto:false,

  equipment:[],

  equipped:{
    weapon:null,
    armor:null,
    ring:null
  }

};


let enemy = {

  hp:0,

  maxHp:0,

  attack:0,

  name:"",

  image:""

};


let autoTimer=null;

let enemyTimer=null;


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.bestWave =
    Math.max(
      game.bestWave,
      game.wave
    );

  localStorage.setItem(
    "DARK_LOOT_SAVE",
    JSON.stringify(game)
  );

}


function loadGame(){

  const saved =
    localStorage.getItem(
      "DARK_LOOT_SAVE"
    );

  if(!saved) return;

  try{

    game={
      ...game,
      ...JSON.parse(saved)
    };

  }catch(e){

    console.log(e);

  }

}


function resetSave(){

  if(
    confirm(
      "セーブデータをリセットしますか？"
    )
  ){

    localStorage.removeItem(
      "DARK_LOOT_SAVE"
    );

    location.reload();

  }

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(
      s=>s.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");


  if(id==="equipment"){
    renderEquipment();
  }

  if(id==="inventory"){
    renderInventory();
  }

  if(id==="upgrade"){
    renderUpgrade();
  }

  if(id==="menu"){
    renderRanking();
  }

  updateUI();

}


/* =========================================================
   START
========================================================= */

function startGame(){

  showScreen("battle");

  spawnEnemy();

  updateUI();

  saveGame();

}


/* =========================================================
   ENEMY
========================================================= */

function spawnEnemy(){

  const index =
    (game.wave-1)
    % enemyImages.length;


  enemy.maxHp =
    Math.floor(
      60 *
      Math.pow(
        1.145,
        game.wave-1
      )
    );


  enemy.hp =
    enemy.maxHp;


  enemy.attack =
    Math.floor(
      5 *
      Math.pow(
        1.12,
        game.wave-1
      )
    );


  enemy.name =
    enemyNames[
      index %
      enemyNames.length
    ];


  enemy.image =
    ASSET +
    enemyImages[index];


  document
    .getElementById(
      "enemyImage"
    )
    .src=enemy.image;


  document
    .getElementById(
      "enemyName"
    )
    .textContent=
      enemy.name;


  document
    .getElementById(
      "waveNumber"
    )
    .textContent=
      game.wave;


  updateEnemyUI();

}


/* =========================================================
   PLAYER STATS
========================================================= */

function equippedAttack(){

  let n=0;

  if(game.equipped.weapon){
    n+=game.equipped.weapon.attack;
  }

  return n;

}


function equippedDefense(){

  let n=0;

  if(game.equipped.armor){
    n+=game.equipped.armor.defense;
  }

  return n;

}


function equippedHp(){

  let n=0;

  if(game.equipped.armor){
    n+=game.equipped.armor.hp;
  }

  return n;

}


function totalAttack(){

  return (

    game.attack +

    game.attackLv * 6 +

    equippedAttack() +

    game.rebirth * 4

  );

}


function totalDefense(){

  return (

    game.defense +

    game.defenseLv * 4 +

    equippedDefense() +

    game.rebirth * 2

  );

}


function totalHp(){

  return (

    game.maxHp +

    game.hpLv * 25 +

    equippedHp() +

    game.rebirth * 20

  );

}


/* =========================================================
   ATTACK
========================================================= */

function manualAttack(){

  attackEnemy();

}


function attackEnemy(){

  if(
    !document
      .getElementById("battle")
      .classList.contains("active")
  ){

    return;

  }


  const damage =

    Math.max(

      1,

      totalAttack() +

      Math.floor(
        Math.random()*7
      )

    );


  enemy.hp -= damage;


  showDamage(
    damage,
    false
  );


  const img =
    document.getElementById(
      "enemyImage"
    );


  img.classList.remove("hit");

  void img.offsetWidth;

  img.classList.add("hit");


  updateEnemyUI();


  if(enemy.hp<=0){

    defeatEnemy();

  }

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function enemyAttack(){

  if(enemy.hp<=0) return;


  const damage =

    Math.max(

      1,

      enemy.attack -
      totalDefense() +
      Math.floor(
        Math.random()*3
      )

    );


  game.hp =

    Math.max(
      0,
      game.hp-damage
    );


  showDamage(
    damage,
    true
  );


  if(game.hp<=0){

    game.hp =
      totalHp();


    game.wave =
      Math.max(
        1,
        game.wave-1
      );


    notice(
      "倒されました… WAVE "
      + game.wave
      + " から再開"
    );


    spawnEnemy();

  }


  updateUI();

}


/* =========================================================
   DEFEAT
========================================================= */

function defeatEnemy(){

  const coins =

    Math.floor(
      10 +
      game.wave*2.7
    );


  game.gold += coins;


  if(
    Math.random()
    <
    Math.min(
      .75,
      .25 +
      game.wave*.008
    )
  ){

    dropEquipment();

  }


  if(
    game.wave % 10 === 0
  ){

    game.ruby++;

    notice(
      "BOSS WAVE CLEAR！ +1 ルビー"
    );

  }else{

    lootPopup(
      "+"+
      coins+
      " 🪙"
    );

  }


  game.wave++;

  game.bestWave =
    Math.max(
      game.bestWave,
      game.wave
    );


  spawnEnemy();

  saveGame();

  updateUI();

}


/* =========================================================
   EQUIPMENT DROP
========================================================= */

function dropEquipment(){

  const index =

    (
      game.wave +
      game.equipment.length
    )
    %
    equipmentImages.length;


  const rarity =

    rarityList[
      (
        game.wave +
        index
      )
      %
      rarityList.length
    ];


  let multiplier=1;


  if(rarity==="R"){
    multiplier=1.5;
  }

  if(rarity==="SR"){
    multiplier=2;
  }

  if(rarity==="SSR"){
    multiplier=3;
  }


  const item={

    id:
      Date.now()+
      Math.random(),

    name:
      equipmentNames[
        index
        %
        equipmentNames.length
      ],

    rarity:rarity,

    image:
      equipmentImages[index],

    attack:
      Math.floor(
        (
          4+
          game.wave*.7
        )*
        multiplier
      ),

    defense:
      Math.floor(
        (
          2+
          game.wave*.35
        )*
        multiplier
      ),

    hp:
      Math.floor(
        (
          10+
          game.wave*2
        )*
        multiplier
      ),

    sell:
      Math.floor(
        (
          30+
          game.wave*5
        )*
        multiplier
      )

  };


  game.equipment.unshift(item);


  if(
    game.equipment.length>30
  ){

    game.equipment.pop();

  }


  lootPopup(
    "✨ 装備ドロップ！"
  );


  saveGame();

}


/* =========================================================
   EQUIP
========================================================= */

function getSlot(item){

  if(
    item.name.includes("鎧")
  ){

    return "armor";

  }


  if(
    item.name.includes("指輪")
  ){

    return "ring";

  }


  return "weapon";

}


function equipItem(id){

  const item =
    game.equipment.find(
      x=>x.id===id
    );


  if(!item) return;


  const slot =
    getSlot(item);


  game.equipped[slot]=item;


  notice(
    item.name+
    " を装備しました！"
  );


  saveGame();

  renderEquipment();

  updateUI();

}


/* =========================================================
   SELL
========================================================= */

function sellItem(id){

  const index =
    game.equipment.findIndex(
      x=>x.id===id
    );


  if(index<0) return;


  const item =
    game.equipment[index];


  const equipped =
    Object
      .values(game.equipped)
      .some(
        x=>x&&x.id===id
      );


  if(equipped){

    notice(
      "装備中のアイテムは売却できません"
    );

    return;

  }


  game.gold += item.sell;

  game.equipment.splice(
    index,
    1
  );


  notice(
    "+"+
    item.sell+
    "コイン"
  );


  saveGame();

  renderEquipment();

  renderInventory();

  updateUI();

}


/* =========================================================
   AUTO
========================================================= */

function toggleAuto(){

  game.auto =
    !game.auto;


  const button =
    document.getElementById(
      "autoButton"
    );


  button.textContent =
    game.auto
      ? "AUTO ON"
      : "AUTO OFF";


  button.classList.toggle(
    "auto-on",
    game.auto
  );


  if(autoTimer){

    clearInterval(
      autoTimer
    );

  }


  if(game.auto){

    autoTimer =
      setInterval(
        attackEnemy,
        520
      );

  }


  saveGame();

}


/* =========================================================
   UPGRADE
========================================================= */

function upgradeCost(
  type
){

  let level=0;


  if(type==="attack"){
    level=game.attackLv;
  }

  if(type==="defense"){
    level=game.defenseLv;
  }

  if(type==="hp"){
    level=game.hpLv;
  }


  return Math.floor(
    45 *
    Math.pow(
      1.35,
      level
    )
  );

}


function upgrade(type){

  const cost =
    upgradeCost(type);


  if(
    game.gold<cost
  ){

    notice(
      "コインが足りません"
    );

    return;

  }


  game.gold -= cost;


  if(type==="attack"){
    game.attackLv++;
  }

  if(type==="defense"){
    game.defenseLv++;
  }

  if(type==="hp"){
    game.hpLv++;
    game.hp=totalHp();
  }


  saveGame();

  renderUpgrade();

  updateUI();

  notice(
    "強化成功！"
  );

}


/* =========================================================
   REBIRTH
========================================================= */

function rebirth(){

  const required =
    25+
    game.rebirth*20;


  if(
    game.wave<required
  ){

    notice(
      "WAVE "+
      required+
      " 到達で転生できます"
    );

    return;

  }


  game.rebirth++;

  game.ruby +=
    5+
    game.rebirth;


  game.wave=1;

  game.gold=0;

  game.attack=18;

  game.defense=8;

  game.maxHp=120;

  game.hp=120;

  game.attackLv=0;

  game.defenseLv=0;

  game.hpLv=0;

  game.equipped={
    weapon:null,
    armor:null,
    ring:null
  };


  spawnEnemy();

  saveGame();

  updateUI();

  renderRanking();


  showScreen(
    "battle"
  );


  notice(
    "🔄 転生成功！"
  );

}


/* =========================================================
   UI
========================================================= */

function updateEnemyUI(){

  const percent =

    Math.max(
      0,
      enemy.hp /
      enemy.maxHp *
      100
    );


  document
    .getElementById(
      "enemyHpFill"
    )
    .style.width=
      percent+
      "%";


  document
    .getElementById(
      "enemyHpText"
    )
    .textContent=

      Math.max(
        0,
        enemy.hp
      )+
      " / "+
      enemy.maxHp;

}


function updateUI(){

  document
    .getElementById(
      "goldTop"
    )
    .textContent=
      game.gold;


  document
    .getElementById(
      "rubyTop"
    )
    .textContent=
      game.ruby;


  document
    .getElementById(
      "attackStat"
    )
    .textContent=
      totalAttack();


  document
    .getElementById(
      "defenseStat"
    )
    .textContent=
      totalDefense();


  document
    .getElementById(
      "hpStat"
    )
    .textContent=
      totalHp();


  document
    .getElementById(
      "inventoryGold"
    )
    .textContent=
      game.gold;


  document
    .getElementById(
      "inventoryRuby"
    )
    .textContent=
      game.ruby;


  document
    .getElementById(
      "inventoryCount"
    )
    .textContent=
      game.equipment.length;


  document
    .getElementById(
      "rebirthCount"
    )
    .textContent=
      game.rebirth;


  document
    .getElementById(
      "playerImage"
    )
    .src=

      ASSET+
      equipmentImages[
        (
          game.wave+3
        )
        %
        equipmentImages.length
      ];


  document
    .getElementById(
      "equipmentCharacter"
    )
    .src=

      ASSET+
      equipmentImages[
        (
          game.wave+5
        )
        %
        equipmentImages.length
      ];


  const autoButton =
    document.getElementById(
      "autoButton"
    );


  autoButton.textContent =
    game.auto
      ? "AUTO ON"
      : "AUTO OFF";


  autoButton.classList.toggle(
    "auto-on",
    game.auto
  );

}


/* =========================================================
   EQUIPMENT SCREEN
========================================================= */

function renderEquipment(){

  const slots =
    document.getElementById(
      "equippedSlots"
    );


  slots.innerHTML="";


  const slotData=[

    [
      "weapon",
      "⚔️",
      "武器"
    ],

    [
      "armor",
      "🛡️",
      "防具"
    ],

    [
      "ring",
      "💍",
      "装飾"
    ]

  ];


  slotData.forEach(
    data=>{

      const [
        type,
        icon,
        name
      ]=data;


      const item =
        game.equipped[type];


      const div =
        document.createElement(
          "div"
        );


      div.className=
        "equipment-slot";


      if(item){

        div.innerHTML=

          `
          <img
            class="equipment-icon"
            src="${ASSET+item.image}"
          >

          <b>
            ${item.name}
          </b>

          <span
            class="equipped-label">

            装備中

          </span>
          `;

      }else{

        div.innerHTML=

          `
          <div
            style="
              font-size:25px;
            ">

            ${icon}

          </div>

          <span
            class="muted">

            ${name}

          </span>
          `;

      }


      slots.appendChild(div);

    }
  );


  const list =
    document.getElementById(
      "equipmentList"
    );


  list.innerHTML="";


  if(
    game.equipment.length===0
  ){

    list.innerHTML=

      `
      <div
        class="muted"
        style="
          text-align:center;
          padding:20px;
        ">

        敵を倒して装備を集めよう！

      </div>
      `;

    return;

  }


  game.equipment.forEach(
    item=>{

      const row =
        document.createElement(
          "div"
        );


      row.className=
        "item-row";


      let rarityClass="";


      if(item.rarity==="SR"){
        rarityClass="cyan";
      }

      if(item.rarity==="SSR"){
        rarityClass="purple";
      }


      row.innerHTML=

        `
        <img
          src="${ASSET+item.image}"
        >

        <div class="item-info">

          <div
            class="
              item-name
              ${rarityClass}
            ">

            ${item.name}
            [${item.rarity}]

          </div>

          <div
            class="item-stats">

            ATK +${item.attack}<br>

            DEF +${item.defense}<br>

            HP +${item.hp}

          </div>

        </div>

        <div class="item-actions">

          <button
            class="
              btn
              green-btn
            "
            onclick="
              equipItem(${item.id})
            ">

            装備

          </button>

          <button
            class="
              btn
              red-btn
            "
            onclick="
              sellItem(${item.id})
            ">

            売却

          </button>

        </div>
        `;


      list.appendChild(row);

    }
  );

}


/* =========================================================
   INVENTORY
========================================================= */

function renderInventory(){

  const list =
    document.getElementById(
      "inventoryList"
    );


  list.innerHTML="";


  if(
    game.equipment.length===0
  ){

    list.innerHTML=

      `
      <div
        class="muted"
        style="
          padding:20px;
          text-align:center;
        ">

        アイテムはまだありません。

      </div>
      `;

    return;

  }


  game.equipment.forEach(
    item=>{

      const row =
        document.createElement(
          "div"
        );


      row.className=
        "item-row";


      row.innerHTML=

        `
        <img
          src="${ASSET+item.image}"
        >

        <div class="item-info">

          <div
            class="item-name">

            ${item.name}

          </div>

          <div
            class="item-stats">

            レア度：
            ${item.rarity}<br>

            攻撃：
            +${item.attack}
           　
            防御：
            +${item.defense}
           　
            HP：
            +${item.hp}

          </div>

        </div>
        `;


      list.appendChild(row);

    }
  );

}


/* =========================================================
   UPGRADE SCREEN
========================================================= */

function renderUpgrade(){

  const list =
    document.getElementById(
      "upgradeList"
    );


  list.innerHTML="";


  const data=[

    [
      "attack",
      "⚔️ 攻撃力",
      game.attackLv,
      "+6"
    ],

    [
      "defense",
      "🛡️ 防御力",
      game.defenseLv,
      "+4"
    ],

    [
      "hp",
      "❤️ 最大HP",
      game.hpLv,
      "+25"
    ]

  ];


  data.forEach(
    x=>{

      const [
        type,
        name,
        level,
        effect
      ]=x;


      const cost =
        upgradeCost(type);


      const row =
        document.createElement(
          "div"
        );


      row.className=
        "upgrade-row";


      row.innerHTML=

        `
        <div>

          <h3
            class="upgrade-name">

            ${name}
            Lv.${level}

          </h3>

          <p
            class="
              upgrade-description
            ">

            次の強化：
            <span class="gold">
              ${cost} 🪙
            </span>

           　
            効果：
            ${effect}

          </p>

        </div>

        <button
          class="
            btn
            gold-btn
          "
          onclick="
            upgrade('${type}')
          ">

          強化

        </button>
        `;


      list.appendChild(row);

    }
  );

}

    ],

    [

    ],

    ],

      5,

    ]

  ];


  list.innerHTML="";


  ranking.forEach(
    r=>{

      const row =
        document.createElement(
          "div"
        );


      row.className=
        "rank-row";


      if(
        r[2]===game.bestWave
      ){

        row.classList.add(
          "my-rank"
        );

      }


      row.innerHTML=

        `
        <div
          class="rank-number">

          ${r[0]}

        </div>

        <div
          class="rank-name">

          ${r[1]}

        </div>

        <div
          class="rank-wave">

          WAVE ${r[2]}

        </div>
        `;


      list.appendChild(row);

    }
  );

}


/* =========================================================
   EFFECTS
========================================================= */

function showDamage(
  value,
  player
){

  const div =
    document.createElement(
      "div"
    );


  div.className=
    "damage-number";


  div.textContent=
    "-"+value;


  div.style.left =
    player
      ? "50%"
      : (
        40+
        Math.random()*20
      )+"%";


  div.style.top =
    player
      ? "65%"
      : "33%";


  document
    .getElementById(
      "effects"
    )
    .appendChild(div);


  setTimeout(
    ()=>div.remove(),
    800
  );

}


function lootPopup(
  text
){

  const div =
    document.createElement(
      "div"
    );


  div.className=
    "loot-popup";


  div.textContent=
    text;


  document
    .getElementById(
      "effects"
    )
    .appendChild(div);


  setTimeout(
    ()=>div.remove(),
    1000
  );

}


function notice(
  text
){

  const old =
    document.querySelector(
      ".notice"
    );


  if(old){
    old.remove();
  }


  const div =
    document.createElement(
      "div"
    );


  div.className=
    "notice";


  div.textContent=
    text;


  document
    .getElementById(
      "game"
    )
    .appendChild(div);


  setTimeout(
    ()=>div.remove(),
    1900
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

loadGame();


enemyTimer =
  setInterval(
    enemyAttack,
    3200
  );


updateUI();

</script>
