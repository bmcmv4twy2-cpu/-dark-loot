<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DARK LOOT</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#08070a;
    color:#eee;
    font-family:
        "Noto Serif JP",
        "Yu Mincho",
        serif;
}

button{
    font-family:inherit;
    color:#eee;
    cursor:pointer;
}

body{
    overflow-x:hidden;
}

/* =========================================
   全体背景
========================================= */

#game{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 22%,
            rgba(117,74,175,.34) 0%,
            rgba(49,30,78,.23) 18%,
            rgba(10,8,17,.95) 55%
        ),
        linear-gradient(
            180deg,
            #191224 0%,
            #0b0910 58%,
            #050508 100%
        );
}

#game:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(circle at 50% 25%,
            rgba(210,190,255,.18),
            transparent 12%),
        linear-gradient(
            110deg,
            transparent 25%,
            rgba(123,72,170,.08) 50%,
            transparent 75%
        );
}

/* 月 */
#moon{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    left:50%;
    top:100px;
    transform:translateX(-50%);

    background:
        radial-gradient(
            circle at 38% 35%,
            #eee8ff,
            #b4a7d0 48%,
            #65577e 72%,
            transparent 73%
        );

    box-shadow:
        0 0 35px rgba(202,180,255,.32),
        0 0 100px rgba(121,83,181,.18);

    opacity:.82;
}

/* 城 */
.castle{
    position:absolute;
    bottom:420px;
    width:100%;
    height:300px;
    pointer-events:none;
    opacity:.8;
}

.tower{
    position:absolute;
    bottom:0;
    width:55px;
    background:
        linear-gradient(
            90deg,
            #09080d,
            #1d1726,
            #08070c
        );
    border:1px solid #27202f;
}

.tower:before{
    content:"";
    position:absolute;
    top:-34px;
    left:-10px;
    border-left:37px solid transparent;
    border-right:37px solid transparent;
    border-bottom:38px solid #15101d;
}

.t1{left:2%;height:210px}
.t2{left:11%;height:280px}
.t3{left:22%;height:170px}
.t4{right:21%;height:220px}
.t5{right:11%;height:290px}
.t6{right:2%;height:200px}

.castle:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:120px;

    background:
        linear-gradient(
            170deg,
            transparent 20%,
            #0b0910 21%,
            #0b0910 65%,
            transparent 66%
        );
}

/* =========================================
   メイン
========================================= */

.wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:8px;
}

/* =========================================
   フレーム
========================================= */

.panel{
    position:relative;
    border:1px solid #74604a;
    background:
        linear-gradient(
            135deg,
            rgba(35,27,30,.97),
            rgba(10,9,12,.97)
        );
    box-shadow:
        inset 0 0 0 2px #171216,
        inset 0 0 20px rgba(0,0,0,.9),
        0 0 8px rgba(0,0,0,.8);
}

.panel:before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid rgba(126,105,78,.35);
    pointer-events:none;
}

/* =========================================
   上部HUD
========================================= */

.topbar{
    display:grid;
    grid-template-columns:260px 1fr 300px;
    gap:8px;
    align-items:stretch;
}

.heroInfo{
    padding:8px;
    display:flex;
    gap:10px;
}

.heroFace{
    width:72px;
    height:72px;
    border-radius:50%;
    border:3px solid #806b4c;

    background:
        radial-gradient(circle at 50% 30%,
            #d8d3e3 0 15%,
            #665f72 16% 28%,
            #211d29 29% 58%,
            #08070b 59%
        );

    box-shadow:
        0 0 0 3px #17131a,
        0 0 15px rgba(148,90,190,.25);
}

.heroText{
    flex:1;
    min-width:0;
}

.heroName{
    font-weight:bold;
    font-size:17px;
    color:#e7d8b7;
}

.bar{
    height:13px;
    margin-top:4px;
    border:1px solid #443532;
    background:#09070a;
    overflow:hidden;
    position:relative;
}

.bar span{
    display:block;
    height:100%;
}

.hp span{
    background:linear-gradient(90deg,#721d1d,#d33c31);
}

.sp span{
    background:linear-gradient(90deg,#142b6a,#3878d4);
}

.exp span{
    background:linear-gradient(90deg,#695219,#d3a63c);
}

.barText{
    position:absolute;
    inset:0;
    text-align:center;
    font-size:9px;
    line-height:11px;
}

.currency{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    padding:10px;
}

.currencyBox{
    min-width:125px;
    padding:7px 10px;

    border:1px solid #725f42;
    background:linear-gradient(#19151a,#09080b);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    font-weight:bold;
}

.coinIcon{
    color:#ffd45a;
}

.rubyIcon{
    color:#ff4c5c;
}

.plus{
    width:25px;
    height:25px;
    border:1px solid #927850;
    background:#171217;
    color:#f0d28b;
    font-size:18px;
}

.topActions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
}

.topBtn{
    border:1px solid #66533c;
    background:
        linear-gradient(#282026,#0e0c10);
    font-size:12px;
    padding:8px 3px;
}

.topBtn:active,
.mainBtn:active,
.navBtn:active{
    transform:scale(.96);
}

/* =========================================
   バトル
========================================= */

.battle{
    margin-top:8px;
    min-height:360px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(8,6,12,.08),
            rgba(5,4,8,.92)
        ),
        radial-gradient(
            circle at 50% 30%,
            rgba(120,70,180,.22),
            transparent 38%
        );
}

.battle:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:90px;

    background:
        linear-gradient(
            170deg,
            transparent 0 25%,
            rgba(20,14,23,.9) 26% 70%,
            #08070b 71%
        );
}

.stageTitle{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 28px;

    border:1px solid #776043;
    background:#100d11;

    color:#e8d5a7;
    font-weight:bold;
    z-index:4;
}

.character{
    position:absolute;
    left:25%;
    bottom:48px;
    width:150px;
    height:180px;
    z-index:5;
}

.characterBody{
    position:absolute;
    left:30px;
    bottom:0;
    width:90px;
    height:130px;

    background:
        linear-gradient(
            90deg,
            #11121a,
            #596070 45%,
            #161820 65%
        );

    clip-path:polygon(
        42% 0,
        64% 5%,
        74% 27%,
        90% 48%,
        78% 100%,
        20% 100%,
        8% 53%,
        30% 27%
    );

    box-shadow:0 0 20px rgba(100,100,130,.3);
}

.characterHead{
    position:absolute;
    left:53px;
    top:0;
    width:45px;
    height:55px;

    background:
        linear-gradient(
            130deg,
            #c6c4ce,
            #777481 45%,
            #1b1821 70%
        );

    clip-path:polygon(
        50% 0,
        90% 28%,
        75% 85%,
        50% 100%,
        20% 85%,
        10% 25%
    );
}

.sword{
    position:absolute;
    right:5px;
    top:30px;
    width:12px;
    height:150px;

    background:linear-gradient(
        90deg,
        #64161b,
        #ff4242,
        #ffd5c0,
        #85171c
    );

    transform:rotate(-32deg);
    box-shadow:0 0 18px #e22936;
}

.enemy{
    position:absolute;
    right:23%;
    bottom:55px;
    width:125px;
    height:150px;
    z-index:5;
}

.enemyBody{
    position:absolute;
    left:25px;
    bottom:0;
    width:75px;
    height:100px;

    background:
        linear-gradient(
            90deg,
            #140d10,
            #5d3031,
            #160d11
        );

    clip-path:polygon(
        50% 0,
        72% 18%,
        85% 52%,
        100% 100%,
        0 100%,
        15% 52%,
        28% 18%
    );
}

.enemyHead{
    position:absolute;
    left:39px;
    top:4px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#271519;
    border:2px solid #693838;
}

.enemyEye{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff4039;
    top:22px;
}

.enemyEye.a{left:11px}
.enemyEye.b{right:11px}

.damage{
    position:absolute;
    z-index:10;
    font-size:24px;
    font-weight:bold;
    color:#ff5749;
    text-shadow:0 2px 4px #000;
    animation:damage 700ms ease-out forwards;
}

@keyframes damage{
    from{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    to{
        opacity:0;
        transform:translateY(-45px) scale(1.25);
    }
}

.loot{
    position:absolute;
    z-index:7;
    bottom:40px;
    right:39%;
    display:flex;
    gap:8px;
}

.lootCoin{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#dcae32;
    border:2px solid #ffe08a;
    color:#68460b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* =========================================
   左右メニュー
========================================= */

.sideMenu{
    position:absolute;
    top:45px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.leftMenu{left:8px}
.rightMenu{right:8px}

.mainBtn{
    min-width:155px;
    padding:10px;

    border:1px solid #756044;
    background:
        linear-gradient(
            180deg,
            #211820,
            #0b090d
        );

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.7),
        0 2px 5px #000;

    color:#e5d5b0;
    text-align:left;
}

.mainBtn strong{
    display:block;
    color:#f0e1c0;
}

.mainBtn small{
    color:#aaa09b;
}

.autoOn{
    color:#73e46b !important;
}

/* =========================================
   下部ナビ
========================================= */

.nav{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
    margin-top:6px;
}

.navBtn{
    padding:9px 3px;
    border:1px solid #685640;
    background:linear-gradient(#19151a,#08070a);
    color:#d8c9a9;
    font-size:12px;
}

/* =========================================
   下部コンテンツ
========================================= */

.contentGrid{
    display:grid;
    grid-template-columns:1.05fr 1.25fr .75fr;
    gap:7px;
    margin-top:7px;
}

.sectionTitle{
    text-align:center;
    padding:8px;
    border-bottom:1px solid #574833;
    color:#e6d5ad;
    font-weight:bold;
    letter-spacing:2px;
}

/* =========================================
   キャラクター
========================================= */

.characterPanel{
    padding:8px;
}

.charPreview{
    min-height:220px;
    position:relative;

    background:
        radial-gradient(
            circle at 50% 50%,
            #302638,
            #0b090e 68%
        );
    border:1px solid #4b3c35;
}

.charModel{
    position:absolute;
    width:100px;
    height:150px;
    left:50%;
    top:25px;
    transform:translateX(-50%);
}

.charModel:before{
    content:"";
    position:absolute;
    left:32px;
    top:0;
    width:40px;
    height:45px;
    border-radius:45% 45% 35% 35%;
    background:#aaa8b1;
    border:4px solid #25232b;
}

.charModel:after{
    content:"";
    position:absolute;
    left:20px;
    top:38px;
    width:65px;
    height:110px;
    background:
        linear-gradient(
            90deg,
            #101219,
            #5a6070,
            #161821
        );
    clip-path:polygon(
        35% 0,
        68% 0,
        92% 35%,
        100% 100%,
        0 100%,
        8% 35%
    );
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;
    padding:6px;
    font-size:11px;
}

.statLine{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #242025;
    padding:3px;
}

.equipList{
    margin-top:6px;
}

.equipItem{
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px;
    border-bottom:1px solid #282229;
    font-size:11px;
}

.equipIcon{
    width:35px;
    height:35px;
    border:1px solid #856b3c;
    background:#19131a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.legend{
    color:#ffd447;
}

.epic{
    color:#e46cff;
}

.rare{
    color:#58b7ff;
}

/* =========================================
   インベントリ
========================================= */

.inventory{
    padding:8px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:3px;
}

.tab{
    padding:7px 2px;
    border:1px solid #4e4035;
    background:#0d0b0f;
    font-size:11px;
}

.tab.active{
    background:#321c1c;
    border-color:#9c493d;
}

.itemGrid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    padding:8px 0;
}

.item{
    min-height:70px;
    position:relative;
    padding:4px;

    border:1px solid #3d363e;
    background:
        linear-gradient(
            145deg,
            #17141a,
            #08070a
        );

    text-align:center;
}

.item.selected{
    border-color:#f1c65d;
    box-shadow:0 0 8px rgba(240,190,70,.35);
}

.item.equipped{
    border-color:#55d06d;
    box-shadow:
        inset 0 0 12px rgba(40,170,70,.16),
        0 0 7px rgba(70,220,100,.2);
}

.itemIcon{
    font-size:26px;
}

.itemLv{
    font-size:9px;
    color:#aaa;
}

.equippedLabel{
    position:absolute;
    left:2px;
    right:2px;
    bottom:2px;
    padding:2px;
    background:#155827;
    color:#b9ffbf;
    font-size:8px;
    font-weight:bold;
}

.inventoryBottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px;
}

/* =========================================
   アイテム詳細
========================================= */

.detail{
    padding:10px;
}

.detailIcon{
    width:100px;
    height:100px;
    margin:10px auto;

    border:2px solid #ad6c32;
    background:
        radial-gradient(
            circle,
            #38251c,
            #0c090c
        );

    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.detailName{
    text-align:center;
    font-weight:bold;
    font-size:15px;
}

.detailStats{
    margin-top:15px;
}

.detailStats div{
    display:flex;
    justify-content:space-between;
    padding:5px;
    border-bottom:1px solid #282027;
    font-size:11px;
}

.detailButtons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    margin-top:12px;
}

.detailBtn{
    padding:9px 2px;
    border:1px solid #72573c;
    background:linear-gradient(#2a1a18,#100a0c);
}

.equipNow{
    border-color:#54a862;
    background:linear-gradient(#244b2b,#0e1c11);
}

/* =========================================
   強化・転生・ランキング
========================================= */

.bottomGrid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-top:7px;
}

.upgrade,
.rebirth,
.ranking{
    padding:8px;
}

.upgradeRow{
    display:grid;
    grid-template-columns:35px 1fr auto auto;
    gap:5px;
    align-items:center;
    padding:8px 3px;
    border-bottom:1px solid #292229;
}

.upgradeIcon{
    font-size:24px;
}

.upgradeName{
    font-size:11px;
}

.upgradeLv{
    font-size:9px;
    color:#bbb;
}

.upgradeCost{
    color:#f2ca62;
    font-size:10px;
}

.smallBtn{
    border:1px solid #785e3c;
    background:#181015;
    padding:7px 8px;
    font-size:10px;
}

.rebirthCore{
    width:100px;
    height:100px;
    margin:12px auto;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #a84ee9,
            #3c155f 45%,
            #120a19 70%
        );

    border:3px solid #85639b;

    box-shadow:
        0 0 20px rgba(170,75,230,.35);
}

.rebirthText{
    text-align:center;
    font-size:12px;
    line-height:1.7;
}

.rebirthBtn{
    display:block;
    width:80%;
    margin:10px auto;
    padding:11px;

    border:1px solid #a35343;
    background:
        linear-gradient(
            #5c201b,
            #1b0b0a
        );

    color:#ffd7ba;
}

.rankRow{
    display:grid;
    grid-template-columns:30px 1fr 55px;
    gap:5px;
    padding:8px 3px;
    border-bottom:1px solid #292229;
    font-size:11px;
}

.rankNo{
    color:#eac45e;
}

/* =========================================
   モーダル
========================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.78);
    padding:12px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow:auto;

    padding:12px;

    border:2px solid #735d43;

    background:
        linear-gradient(
            145deg,
            #201920,
            #08070a
        );

    box-shadow:
        0 0 30px #000,
        inset 0 0 25px rgba(0,0,0,.8);
}

.modalTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;

    color:#e7d5ad;
    font-size:18px;
    padding-bottom:8px;
    border-bottom:1px solid #584832;
}

.close{
    width:32px;
    height:32px;
    border:1px solid #805449;
    background:#210e0e;
    color:#ff9b8d;
}

/* =========================================
   通知
========================================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(30px);

    z-index:2000;

    opacity:0;
    pointer-events:none;

    padding:10px 18px;

    border:1px solid #876a42;
    background:#120e12;
    color:#f0d28c;

    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================
   スマホ
========================================= */

@media(max-width:900px){

    .wrap{
        padding:4px;
    }

    .topbar{
        grid-template-columns:1fr;
    }

    .topActions{
        grid-template-columns:repeat(4,1fr);
    }

    .currency{
        padding:5px;
    }

    .currencyBox{
        min-width:0;
        flex:1;
    }

    .battle{
        min-height:410px;
    }

    .leftMenu{
        left:5px;
    }

    .rightMenu{
        right:5px;
    }

    .mainBtn{
        min-width:105px;
        padding:7px;
        font-size:10px;
    }

    .character{
        left:27%;
        transform:scale(.85);
        transform-origin:bottom center;
    }

    .enemy{
        right:20%;
        transform:scale(.8);
        transform-origin:bottom center;
    }

    .contentGrid{
        grid-template-columns:1fr;
    }

    .bottomGrid{
        grid-template-columns:1fr;
    }

    .itemGrid{
        grid-template-columns:repeat(5,1fr);
    }

    .navBtn{
        min-height:50px;
        font-size:10px;
    }
}

@media(max-width:500px){

    .heroFace{
        width:55px;
        height:55px;
    }

    .heroName{
        font-size:13px;
    }

    .currencyBox{
        font-size:12px;
    }

    .battle{
        min-height:390px;
    }

    .stageTitle{
        font-size:12px;
    }

    .leftMenu,
    .rightMenu{
        top:50px;
    }

    .mainBtn{
        min-width:88px;
        font-size:9px;
    }

    .character{
        left:24%;

<div id="toast"></div>


<script>

/* =========================================================
   DARK LOOT
   GAME DATA
========================================================= */

const defaultGame = {

    level:1,

    exp:0,

    coin:1000,

    ruby:100,

    stage:1,

    hp:100,

    sp:100,

    rebirth:0,

    auto:false,

    enemyHp:100,

    selectedItem:null,

    inventory:[],

    upgrades:{
        attack:0,
        hp:0,
        defense:0,
        crit:0
    },

    equipped:{
        weapon:null,
        armor:null,
        helmet:null,
        gloves:null,
        boots:null,
        accessory:null
    }

};


/* =========================================================
   SAVE / LOAD
========================================================= */

let game;

function loadGame(){

    try{

        const saved =
            localStorage.getItem("DARK_LOOT_SAVE");

        if(saved){

            game={
                ...defaultGame,
                ...JSON.parse(saved)
            };

        }else{

            game=JSON.parse(
                JSON.stringify(defaultGame)
            );

            createStarterItems();

        }

    }catch(e){

        game=JSON.parse(
            JSON.stringify(defaultGame)
        );

        createStarterItems();

    }

    if(!game.inventory.length){
        createStarterItems();
    }

    recalculateEnemy();

    renderAll();
}


function saveGame(){

    localStorage.setItem(
        "DARK_LOOT_SAVE",
        JSON.stringify(game)
    );

}


/* =========================================================
   ITEMS
========================================================= */

const itemTypes=[
    "weapon",
    "armor",
    "helmet",
    "gloves",
    "boots",
    "accessory"
];

const names={
    weapon:[
        "ブラッドソード",
        "ダークブレード",
        "魔剣グリム"
    ],
    armor:[
        "ダークメイル",
        "漆黒の鎧",
        "デスアーマー"
    ],
    helmet:[
        "シャドウヘルム",
        "漆黒の兜",
        "デスヘルム"
    ],
    gloves:[
        "デモングローブ",
        "シャドウグローブ",
        "黒騎士の手甲"
    ],
    boots:[
        "ヘルブーツ",
        "ダークブーツ",
        "黒騎士の靴"
    ],
    accessory:[
        "狂戦士の指輪",
        "魔力の指輪",
        "深淵の指輪"
    ]
};

const icons={
    weapon:"⚔️",
    armor:"🛡️",
    helmet:"⛑️",
    gloves:"🧤",
    boots:"🥾",
    accessory:"💍"
};

const rarities=[
    {
        name:"コモン",
        cls:"common",
        color:"#aaa",
        multiplier:1
    },
    {
        name:"レア",
        cls:"rare",
        color:"#4fb4ff",
        multiplier:1.6
    },
    {
        name:"エピック",
        cls:"epic",
        color:"#e15cff",
        multiplier:2.5
    },
    {
        name:"レジェンド",
        cls:"legend",
        color:"#ffd33d",
        multiplier:4
    }
];


function createStarterItems(){

    game.inventory=[];

    itemTypes.forEach((type,index)=>{

        game.inventory.push(
            makeItem(
                type,
                1,
                index===0 ? 1 : 0
            )
        );

    });

}


function makeItem(type,level=1,rarityIndex=null){

    if(rarityIndex===null){

        const r=Math.random();

        if(r<.03) rarityIndex=3;
        else if(r<.13) rarityIndex=2;
        else if(r<.35) rarityIndex=1;
        else rarityIndex=0;

    }

    const rarity=rarities[rarityIndex];

    const base=10+level*6;

    return{

        id:
            Date.now().toString(36)+
            Math.random().toString(36).slice(2),

        type,

        name:
            names[type][
                Math.floor(
                    Math.random()*names[type].length
                )
            ],

        icon:icons[type],

        level,

        rarity:rarityIndex,

        power:
            Math.floor(
                base*rarity.multiplier
            ),

        price:
            Math.floor(
                base*
                rarity.multiplier*
                12
            )

    };

}


/* =========================================================
   PLAYER STATS
========================================================= */

function getAttack(){

    let value=
        25+
        game.level*8+
        game.upgrades.attack*25+
        game.rebirth*40;

    Object.values(game.equipped)
        .forEach(item=>{

            if(item){
                value+=item.power;
            }

        });

    return Math.floor(value);

}


function getDefense(){

    let value=
        10+
        game.level*4+
        game.upgrades.defense*15+
        game.rebirth*25;

    Object.values(game.equipped)
        .forEach(item=>{

            if(item){
                value+=Math.floor(item.power*.35);
            }

        });

    return Math.floor(value);

}


function getMaxHP(){

    return Math.floor(
        100+
        game.level*35+
        game.upgrades.hp*100+
        game.rebirth*200
    );

}


function getCrit(){

    return Math.min(
        75,
        5+
        game.upgrades.crit+
        game.rebirth
    );
}


function getPower(){

    return Math.floor(
        getAttack()+
        getDefense()+
        getMaxHP()/5+
        getCrit()*10
    );

}


/* =========================================================
   ENEMY
========================================================= */

function recalculateEnemy(){

    game.enemyHp=
        Math.floor(
            70+
            game.stage*55+
            Math.pow(game.stage,1.35)*18
        );

}


function enemyAttack(){

    if(game.enemyHp<=0)return;

    const damage=
        Math.max(
            1,
            Math.floor(
                (
                    5+
                    game.stage*3+
                    Math.pow(game.stage,1.15)
                )
                -
                getDefense()*.08
            )
        );

    game.hp=
        Math.max(
            0,
            game.hp-damage
        );

    showDamage(
        damage,
        false
    );

    if(game.hp<=0){

        playerDefeated();

    }

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function attack(){

    if(game.hp<=0)return;

    let damage=getAttack();

    let critical=
        Math.random()<
        getCrit()/100;

    if(critical){

        damage=
            Math.floor(
                damage*1.8
            );

    }

    game.enemyHp=
        Math.max(
            0,
            game.enemyHp-damage
        );

    showDamage(
        damage,
        true,
        critical
    );

    if(game.enemyHp<=0){

        enemyDefeated();

    }

    renderAll();

}


/* =========================================================
   ENEMY DEFEATED
========================================================= */

function enemyDefeated(){

    const coinReward=
        Math.floor(
            20+
            game.stage*15+
            Math.random()*30
        );

    game.coin+=coinReward;

    game.exp+=
        15+
        game.stage*8;

    createLoot();

    if(
        game.exp>=
        game.level*100
    ){

        game.exp=0;
        game.level++;

        showToast(
            "レベルアップ！ Lv."+game.level
        );

    }

    game.stage++;

    recalculateEnemy();

    game.hp=
        Math.min(
            getMaxHP(),
            game.hp+
            Math.floor(getMaxHP()*.18)
        );

    renderAll();

    saveGame();

}


function playerDefeated(){

    game.hp=
        Math.floor(
            getMaxHP()*.5
        );

    game.stage=
        Math.max(
            1,
            game.stage-1
        );

    recalculateEnemy();

    showToast(
        "力尽きた…ステージが少し戻りました"
    );

    renderAll();

}


/* =========================================================
   LOOT
========================================================= */

function createLoot(){

    const drop=
        Math.random()<.55;

    if(!drop)return;

    const item=
        makeItem(
            itemTypes[
                Math.floor(
                    Math.random()*
                    itemTypes.length
                )
            ],
            Math.max(
                1,
                game.stage
            )
        );

    game.inventory.push(item);

    if(game.inventory.length>100){

        game.inventory.shift();

    }

    showToast(
        "ドロップ！ "+
        item.name+
        " ["+
        rarities[item.rarity].name+
        "]"
    );

    renderInventory();

}


/* =========================================================
   AUTO
========================================================= */

let autoTimer=null;

function toggleAuto(){

    game.auto=!game.auto;

    if(game.auto){

        startAuto();

        showToast(
            "オート戦闘 ON"
        );

    }else{

        stopAuto();

        showToast(
            "オート戦闘 OFF"
        );

    }

    renderAll();

}


function startAuto(){

    stopAuto();

    autoTimer=
        setInterval(()=>{

            attack();

        },700);

}


function stopAuto(){

    if(autoTimer){

        clearInterval(autoTimer);
        autoTimer=null;

    }

}


/* =========================================================
   ENEMY ATTACK LOOP
========================================================= */

setInterval(()=>{

    enemyAttack();

},1500);


/* =========================================================
   STAGE
========================================================= */

function nextStage(){

    game.stage++;

    recalculateEnemy();

    game.hp=
        getMaxHP();

    showToast(
        "ステージ "+game.stage
    );

    renderAll();

}


function bossBattle(){

    game.enemyHp=
        Math.floor(
            getMaxHP()*
            2.2+
            game.stage*500
        );

    showToast(
        "ボスが出現した！"
    );

    renderAll();

}


/* =========================================================
   EQUIPMENT
========================================================= */

function equipItem(id){

    const item=
        game.inventory.find(
            x=>x.id===id
        );

    if(!item)return;

    game.equipped[item.type]=item;

    game.selectedItem=id;

    showToast(
        item.name+
        " を装備しました"
    );

    renderAll();

    saveGame();

}


function unequipItem(type){

    game.equipped[type]=null;

    renderAll();

    saveGame();

}


/* =========================================================
   INVENTORY
========================================================= */

let currentFilter="equip";


function filterItems(filter){

    currentFilter=filter;

    renderInventory();

}


function openInventory(){

    document.getElementById(
        "modalTitle"
    ).textContent=
        "インベントリ";

    document.getElementById(
        "modalContent"
    ).innerHTML=`

        <div class="itemGrid"
             id="modalInventory">
        </div>

        <div style="
            margin-top:10px;
            color:#cdbd9e;
            font-size:12px;
        ">
            アイテムをタップすると詳細を確認できます。
        </div>
    `;

    document.getElementById(
        "modal"
    ).classList.add("show");

    renderModalInventory();

}


function renderModalInventory(){

    const box=
        document.getElementById(
            "modalInventory"
        );

    if(!box)return;

    box.innerHTML="";

    game.inventory.forEach(item=>{

        const equipped=
            game.equipped[item.type] &&
            game.equipped[item.type].id===
            item.id;

        const r=
            rarities[item.rarity];

        const div=
            document.createElement("div");

        div.className=
            "item"+
            (equipped ? " equipped":"");

        div.innerHTML=`

            <div class="itemIcon">
                ${item.icon}
            </div>

            <div
                style="color:${r.color};font-size:9px;">
                ${r.name}
            </div>

            <div class="itemLv">
                +${item.level}
            </div>

            ${
                equipped
                ?
                `<div class="equippedLabel">
                    装備中
                </div>`
                :""
            }

        `;

        div.onclick=()=>{

            game.selectedItem=item.id;

            closeModal();

            renderAll();

        };

        box.appendChild(div);

    });

}


function renderInventory(){

    const box=
        document.getElementById(
            "itemGrid"
        );

    if(!box)return;

    box.innerHTML="";

    game.inventory.forEach(item=>{

        const equipped=
            game.equipped[item.type] &&
            game.equipped[item.type].id===
            item.id;

        const r=
            rarities[item.rarity];

        const div=
            document.createElement("div");

        div.className=
            "item"+
            (equipped?" equipped":"")+
            (
                game.selectedItem===item.id
                ?" selected":""
            );

        div.innerHTML=`

            <div class="itemIcon">
                ${item.icon}
            </div>

            <div style="
                color:${r.color};
                font-size:9px;
            ">
                ${r.name}
            </div>

            <div class="itemLv">
                +${item.level}
            </div>

            ${
                equipped
                ?
                `<div class="equippedLabel">
                    装備中
                </div>`
                :""
            }

        `;

        div.onclick=()=>{

            game.selectedItem=item.id;

            renderAll();

        };

        box.appendChild(div);

    });

    document.getElementById(
        "inventoryCount"
    ).textContent=
        game.inventory.length;

}


function renderDetail(){

    const area=
        document.getElementById(
            "detailArea"
        );

    const item=
        game.inventory.find(
            x=>x.id===game.selectedItem
        );

    if(!item){

        area.innerHTML=`

            <div class="detailIcon">
                ⚔
            </div>

            <div class="detailName">
                アイテムを選択してください
            </div>
        `;

        return;

    }

    const r=
        rarities[item.rarity];

    const equipped=
        game.equipped[item.type] &&
        game.equipped[item.type].id===
        item.id;

    area.innerHTML=`

        <div class="detailIcon">
            ${item.icon}
        </div>

        <div class="detailName"
             style="color:${r.color};">

            ${item.name}
            +${item.level}

            ${
                equipped
                ?
                `<div style="
                    color:#75e67b;
                    font-size:11px;
                    margin-top:5px;
                ">
                    ● 装備中
                </div>`
                :""
            }

        </div>

        <div style="
            text-align:center;
            color:${r.color};
            font-size:11px;
            margin-top:4px;
        ">
            ${r.name}
        </div>

        <div class="detailStats">

            <div>
                <span>攻撃力</span>
                <b>${item.power}</b>
            </div>

            <div>
                <span>売却価格</span>
                <b>${item.price} 🪙</b>
            </div>

        </div>

        <div class="detailButtons">

            ${
                equipped
                ?
                `<button
                    class="detailBtn"
                    onclick="unequipItem('${item.type}')">
                    装備解除
                </button>`
                :
                `<button
                    class="detailBtn equipNow"
                    onclick="equipItem('${item.id}')">
                    装備する
                </button>`
            }

            <button
                class="detailBtn"
                onclick="upgradeItem('${item.id}')">
                強化
            </button>

            <button
                class="detailBtn"
                onclick="sellItem('${item.id}')">
                売却
            </button>

        </div>

    `;

}


/* =========================================================
   SELL
========================================================= */

function sellItem(id){

    const item=
        game.inventory.find(
            x=>x.id===id
        );

    if(!item)return;

    const equipped=
        game.equipped[item.type] &&
        game.equipped[item.type].id===
        item.id;

    if(equipped){

        showToast(
            "装備中のアイテムは売却できません"
        );

        return;

    }

    game.coin+=item.price;

    game.inventory=
        game.inventory.filter(
            x=>x.id!==id
        );

    game.selectedItem=null;

    showToast(
        item.price+
        "コインで売却しました"
    );

    renderAll();

    saveGame();

}


function sellSelected(){

    if(!game.selectedItem){

        showToast(
            "アイテムを選択してください"
        );

        return;

    }

    sellItem(
        game.selectedItem
    );

}


function sellAll(){

    let amount=0;

    game.inventory=
        game.inventory.filter(item=>{

            const equipped=
                game.equipped[item.type] &&
                game.equipped[item.type].id===
                item.id;

            if(equipped)return true;

            amount+=item.price;

            return false;

        });

    game.coin+=amount;

    game.selectedItem=null;

    showToast(
        amount+
        "コイン獲得"
    );

    renderAll();

    saveGame();

}


/* =========================================================
   ITEM UPGRADE
========================================================= */

function upgradeItem(id){

    const item=
        game.inventory.find(
            x=>x.id===id
        );

    if(!item)return;

    const cost=
        Math.floor(
            100*
            (item.level+1)*
            (item.level+1)
        );

    if(game.coin<cost){

        showToast(
            "コインが足りません"
        );

        return;

    }

    game.coin-=cost;

    item.level++;

    item.power=
        Math.floor(
            item.power*1.18
        );

    item.price=
        Math.floor(
            item.price*1.12
        );

    if(
        game.equipped[item.type] &&
        game.equipped[item.type].id===
        item.id
    ){

        game.equipped[item.type]=item;

    }

    showToast(
        item.name+
        " を強化しました"
    );

    renderAll();

    saveGame();

}


/* =========================================================
   COIN UPGRADES
========================================================= */

function getUpgradeCost(type){

    const lv=
        game.upgrades[type];

    return Math.floor(
        250*
        Math.pow(
            1.35,
            lv
        )
    );

}


function upgrade(type){

    const cost=
        getUpgradeCost(type);

    if(game.coin<cost){

        showToast(
            "コインが足りません"
        );

        return;

    }

    game.coin-=cost;

    game.upgrades[type]++;

    game.hp=
        Math.min(
            getMaxHP(),
            game.hp
        );

    showToast(
        "能力を強化しました！"
    );

    renderAll();

    saveGame();

}


function renderUpgrade(){

    const box=
        document.getElementById(
            "upgradeList"
        );

    const list=[

        ["attack","⚔️","攻撃力"],
        ["hp","❤️","体力"],
        ["defense","🛡️","防御力"],
        ["crit","💥","クリティカル"]

    ];

    box.innerHTML="";

    list.forEach(row=>{

        const type=row[0];

        const lv=
            game.upgrades[type];

        const cost=
            getUpgradeCost(type);

        const div=
            document.createElement("div");

        div.className=
            "upgradeRow";

        div.innerHTML=`

            <div class="upgradeIcon">
                ${row[1]}
            </div>

            <div class="upgradeName">

                ${row[2]}

                <div class="upgradeLv">
                    Lv.${lv}
                </div>

            </div>

            <div class="upgradeCost">
                ${cost} 🪙
            </div>

            <button
                class="smallBtn"
                onclick="upgrade('${type}')">
                強化
            </button>

        `;

        box.appendChild(div);

    });

}


/* =========================================================
   RANKING
========================================================= */

function getRanking(){

    const names=[
        "暗黒の覇者",
        "無限の剣士",
        "伝説の勇者",
        "シャドウハンター",
        "ダークスレイヤー"
    ];

    const list=[
        {
            name:names[0],
            rebirth:28
        },
        {
            name:names[1],
            rebirth:25
        },
        {
            name:names[2],
            rebirth:22
        },
        {
            name:names[3],
            rebirth:18
        },
        {
            name:names[4],
            rebirth:game.rebirth
        }
    ];

    return list.sort(
        (a,b)=>
            b.rebirth-a.rebirth
    );

}


function renderRanking(){

    const box=
        document.getElementById(
            "rankingList"
        );

    const list=getRanking();

    box.innerHTML="";

    list.forEach((x,i)=>{

        box.innerHTML+=`

            <div class="rankRow">

                <div class="rankNo">
                    ${i+1}位
                </div>

                <div>
                    ${x.name}
                </div>

                <div>
                    ${x.rebirth}回
                </div>

            </div>

        `;

    });

}


function openRanking(){

    document.getElementById(
        "modalTitle"
    ).textContent=
        "ランキング";

    const list=
        getRanking();

    let html=`

        <div style="
            text-align:center;
            color:#d7c69e;
            padding:10px;
        ">
            転生回数ランキング
        </div>

    `;

    list.forEach((x,i)=>{

        html+=`

            <div class="rankRow">

                <div class="rankNo">
                    ${i+1}位
                </div>

                <div>
                    ${x.name}
                </div>

                <div>
                    ${x.rebirth}回
                </div>

            </div>

        `;

    });

    html+=`

        <div style="
            text-align:center;
            margin-top:15px;
            padding:10px;
            border-top:1px solid #40342b;
            color:#e8d28f;
        ">
            あなたの転生回数：
            ${game.rebirth}回
        </div>

    `;

    document.getElementById(
        "modalContent"
    ).innerHTML=html;

    document.getElementById(
        "modal"
    ).classList.add("show");

}


/* =========================================================
   REBIRTH
========================================================= */

function rebirth(){

    const requirement=
        Math.max(
            10,
            game.stage
        );

    if(game.stage<requirement){

        showToast(
            "転生条件を満たしていません"
        );

        return;

    }

    game.rebirth++;

    game.level=1;
    game.exp=0;

    game.stage=1;

    game.hp=getMaxHP();

    recalculateEnemy();

    showToast(
        "転生成功！ 永続ボーナス獲得！"
    );

    renderAll();

    saveGame();

}


/* =========================================================
   RUBY SHOP
========================================================= */

function rubyShop(){

    document.getElementById(
        "modalTitle"
    ).textContent=
        "ルビーショップ";

    document.getElementById(
        "modalContent"
    ).innerHTML=`

        <div style="
            padding:15px;
            text-align:center;
        ">

            <div style="
                font-size:18px;
                color:#ff7080;
            ">
                ◆ ${game.ruby}
            </div>

            <button
                class="mainBtn"
                style="width:100%;margin-top:15px;"
                onclick="buyRubyPower()">

                ⚔️
                <strong>
                    ルビーの力
                </strong>

                <small>
                    100ルビーで攻撃力+100
                </small>

            </button>

        </div>
    `;

    document.getElementById(
        "modal"
    ).classList.add("show");

}


function buyRubyPower(){

    if(game.ruby<100){

        showToast(
            "ルビーが足りません"
        );

        return;

    }

    game.ruby-=100;

    game.upgrades.attack+=4;

    showToast(
        "ルビー強化成功！"
    );

    closeModal();

    renderAll();

    saveGame();

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =========================================================
   DAMAGE EFFECT
========================================================= */

function showDamage(
    amount,
    player=true,
    critical=false
){

    const div=
        document.createElement("div");

    div.className="damage";

    div.textContent=
        (critical?"CRITICAL ":"")+
        amount;

    div.style.left=
        (
            player
            ? "38%"
            : "63%"
        );

    div.style.top=
        (
            player
            ? "48%"
            : "42%"
        );

    if(!player){

        div.style.color="#e36b69";

    }

    document.querySelector(
        ".battle"
    ).appendChild(div);

    setTimeout(
        ()=>div.remove(),
        700
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const toast=
        document.getElementById(
            "toast"
        );

    toast.textContent=text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=
        setTimeout(()=>{

            toast.classList.remove("show");

        },1800);

}


/* =========================================================
   RENDER
========================================================= */

function renderHUD(){

    const maxHP=getMaxHP();

    game.hp=
        Math.min(
            game.hp,
            maxHP
        );

    document.getElementById(
        "playerLevel"
    ).textContent=
        game.level;

    document.getElementById(
        "coinText"
    ).textContent=
        game.coin.toLocaleString();

    document.getElementById(
        "rubyText"
    ).textContent=
        game.ruby.toLocaleString();

    document.getElementById(
        "stageText"
    ).textContent=
        game.stage;

    document.getElementById(
        "rebirthCount"
    ).textContent=
        game.rebirth+"回";

    document.getElementById(
        "hpText"
    ).textContent=
        game.hp.toLocaleString()+
        " / "+
        maxHP.toLocaleString();

    document.getElementById(
        "hpBar"
    ).style.width=
        (
            game.hp/maxHP*100
        )+"%";

    document.getElementById(
        "spText"
    ).textContent=
        game.sp+
        " / 100";

    document.getElementById(
        "spBar"
    ).style.width=
        game.sp+"%";

    const expMax=
        game.level*100;

    document.getElementById(
        "expText"
    ).textContent=
        game.exp+
        " / "+
        expMax;

    document.getElementById(
        "expBar"
    ).style.width=
        (
            game.exp/expMax*100
        )+"%";

    document.getElementById(
        "powerText"
    ).textContent=
        getPower().toLocaleString();

    document.getElementById(
        "autoText"
    ).textContent=
        game.auto
        ? "ON"
        : "OFF";

    document.getElementById(
        "autoText"
    ).className=
        game.auto
        ? "autoOn"
        : "";

}


function renderStats(){

    document.getElementById(
        "attackStat"
    ).textContent=
        getAttack().toLocaleString();

    document.getElementById(
        "defenseStat"
    ).textContent=
        getDefense().toLocaleString();

    document.getElementById(
        "hpStat"
    ).textContent=
        getMaxHP().toLocaleString();

    document.getElementById(
        "critStat"
    ).textContent=
        getCrit()+"%";

    document.getElementById(
        "critDamageStat"
    ).textContent=
        "180%";

    document.getElementById(
        "speedStat"
    ).textContent=
        "1.00";

}


/* =========================================================
   CURRENT EQUIPMENT
========================================================= */

function renderEquipment(){

    const box=
        document.getElementById(
            "equipmentList"
        );

    box.innerHTML="";

    itemTypes.forEach(type=>{

        const item=
            game.equipped[type];

        if(item){

            const r=
                rarities[item.rarity];

            box.innerHTML+=`

                <div class="equipItem">

                    <div class="equipIcon">
                        ${item.icon}
                    </div>

                    <div style="flex:1">

                        <div style="
                            color:${r.color};
                        ">
                            ${item.name}
                            +${item.level}
                        </div>

                        <div style="
                            font-size:9px;
                            color:#aaa;
                        ">
                            ${r.name}
                        </div>

                    </div>

                    <div style="
                        color:#74e67b;
                        font-size:9px;
                    ">
                        装備中
                    </div>

                </div>

            `;

        }else{

            box.innerHTML+=`

                <div class="equipItem">

                    <div class="equipIcon">
                        ?
                    </div>

                    <div style="
                        color:#777;
                    ">
                        ${typeName(type)}
                    </div>

                    <div style="
                        color:#666;
                        font-size:9px;
                    ">
                        未装備
                    </div>

                </div>

            `;

        }

    });

}


function typeName(type){

    const n={
        weapon:"武器",
        armor:"防具",
        helmet:"兜",
        gloves:"手袋",
        boots:"靴",
        accessory:"アクセサリー"
    };

    return n[type];

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

    renderHUD();

    renderStats();

    renderEquipment();

    renderInventory();

    renderDetail();

    renderUpgrade();

    renderRanking();

}


/* =========================================================
   START
========================================================= */

loadGame();


/* =========================================
   オート復旧
========================================= */

if(game.auto){

    startAuto();

}


/* =========================================
   定期セーブ
========================================= */

setInterval(()=>{

    saveGame();

},5000);


/* =========================================
   タブを閉じる前に保存
========================================= */

window.addEventListener(
    "beforeunload",
    saveGame
);

</script>
