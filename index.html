<!-- DARK LOOT V2.5 UI + BATTLE FIX PATCH -->
<style>
:root{
  --dl-gold:#d6b56b;
  --dl-gold2:#8e6b35;
  --dl-ink:#0b0807;
  --dl-panel:#17100d;
  --dl-panel2:#241711;
  --dl-red:#9f2630;
  --dl-purple:#6841a0;
}

html,body{
  background:#070504!important;
}

#app{
  background:
    radial-gradient(ellipse at 50% 35%,rgba(105,56,29,.22),transparent 42%),
    radial-gradient(ellipse at 20% 80%,rgba(80,25,18,.18),transparent 38%),
    linear-gradient(180deg,#090706 0%,#120c09 48%,#050403 100%)!important;
}

#app:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
  opacity:.22;

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0 1px,
      transparent 1px 4px
    ),
    radial-gradient(
      circle at 30% 30%,
      rgba(255,220,160,.05),
      transparent 22%
    ),
    radial-gradient(
      circle at 70% 70%,
      rgba(0,0,0,.4),
      transparent 35%
    );

  mix-blend-mode:screen;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:
    linear-gradient(
      180deg,
      #1b120e,
      #0a0705
    )!important;

  border-bottom:
    1px solid rgba(214,181,107,.45)!important;

  box-shadow:
    0 3px 18px rgba(0,0,0,.65),
    inset 0 -1px rgba(255,255,255,.06);
}

.logo{
  color:#ead8a6!important;
  text-shadow:0 2px 10px #000;
  letter-spacing:5px!important;
}

.logoSub{
  color:#927c55!important;
}

.currency{
  border-radius:5px!important;

  background:
    linear-gradient(
      180deg,
      #251b15,
      #100b08
    )!important;

  border:
    1px solid rgba(214,181,107,.45)!important;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.7),
    0 2px 8px #000;
}

.main{
  background:transparent!important;
  z-index:2;
}

.screen{
  padding:8px 9px 25px!important;
}

/* =========================
   PANELS
========================= */

.card,
.playerPanel,
.item,
.equipSlot,
.upgrade,
.statCard{

  border-radius:4px!important;

  background:
    linear-gradient(
      180deg,
      rgba(38,24,18,.96),
      rgba(13,9,7,.96)
    )!important;

  border:
    1px solid rgba(177,143,83,.42)!important;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.75),
    0 10px 28px rgba(0,0,0,.5)!important;
}

.card,
.modalBox,
.stage{
  position:relative;
}

.card:before,
.modalBox:before,
.stage:before{

  content:"";

  position:absolute;
  inset:5px;

  pointer-events:none;

  border:
    1px solid rgba(214,181,107,.18);

  box-shadow:
    inset 0 0 18px rgba(214,181,107,.06);

.title{

}

.subtitle,

}

/* =========================
   BUTTONS
========================= */

.bigButton,
.attackButton{

  border-radius:5px!important;

  background:
    linear-gradient(
      180deg,
      #7d2b30,
      #471318
    )!important;

  border:
    1px solid #b97862!important;

  box-shadow:
    inset 0 1px rgba(255,255,255,.15),

.smallButton{

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{

    linear-gradient(

.navButton.active{

  text-shadow:

/* =========================
   BATTLE STAGE
========================= */

.stage{

    radial-gradient(
      ellipse at 50% 72%,
      rgba(119,55,27,.28),

    radial-gradient(
      ellipse at 50% 18%,
      rgba(100,80,45,.12),

}

.floorNumber{

========================= */

.enemyCore:before,

}

.enemyName{

.enemyHpBar{

  height:11px!important;

  border:
    1px solid #513326;

}

.enemyHpFill{
  background:
    linear-gradient(
      90deg,
      #8d2026,
      #d35b3c
    )!important;
}

.enemyHpText{
  color:#ad9876!important;
}

/* =========================
   PLAYER
========================= */

.playerPanel{

  background:
    linear-gradient(
      180deg,
      rgba(35,22,16,.96),
      rgba(12,8,6,.96)
    )!important;
}

.playerName{
  color:#e4d4b0!important;
}

.playerLevel{
  color:#d7b86d!important;
}

.bar{

  background:#0b0806!important;

  border:
    1px solid #4d3625;
}

.hpFill{
  background:
    linear-gradient(
      90deg,
      #8f1d29,
      #d64b3e
    )!important;
}

.xpFill{
  background:
    linear-gradient(
      90deg,
      #7350a1,
      #b28bca
    )!important;
}

/* =========================
   AUTO BUTTON
========================= */

.attackArea{
  grid-template-columns:
    1fr 92px!important;
}

.autoButton{

  height:54px;

  border-radius:5px!important;

  background:
    linear-gradient(
      180deg,
      #3b3024,
      #1b140f
    )!important;

  border:
    1px solid #a98a50!important;

  color:#d8c393!important;
}

.autoButton.on{

  background:
    linear-gradient(
      180deg,
      #34715a,
      #173b2d
    )!important;

  border-color:#8bc8a8!important;

  box-shadow:
    0 0 18px rgba(60,200,140,.18)!important;
}

/* =========================
   ORIGINAL ADVENTURER ART
========================= */

.dlHeroArt{

  position:absolute;

  left:50%;
  bottom:18px;

  transform:
    translateX(-50%);

  z-index:4;

  pointer-events:none;

  opacity:.9;

  filter:
    drop-shadow(0 12px 8px #000);

.dlHeroArt .head{

    linear-gradient(
      145deg,

    2px solid #8b7654;
}

.dlHeroArt .body{

  border-radius:

  background:
    linear-gradient(

.dlHeroArt .cape{

  position:absolute;

    );

.dlHeroArt .sword{

  position:absolute;

  left:4px;

    );

  box-shadow:

.dlHeroArt .guard{

  position:absolute;

  left:-3px;
  top:62px;

  width:25px;

}

.dlHeroArt .shield{

  position:absolute;

  right:-4px;
  top:55px;

  width:29px;
  height:38px;

  border-radius:
    45% 45% 50% 50%;

  background:
    linear-gradient(
      145deg,
      #6b6257,
      #211c18

    2px solid #9c7d4e;

    rotate(-8deg);

/* =========================
   DEFEAT SCREEN
========================= */

.dlDefeatModal{

  position:absolute;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:
    blur(5px);
}

.dlDefeatModal.show{
  display:flex;
}

.dlDefeatBox{

  width:
    min(330px,92vw);

  padding:
    24px 18px;

  text-align:center;

  background:
    linear-gradient(
      180deg,
      #291812,
      #0c0806
    );

  border:
    1px solid #b08b4f;

  box-shadow:
    0 20px 70px #000,
    inset 0 0 0 2px #0a0705;

  border-radius:5px;
}

.dlDefeatBox h2{

  margin:
    0 0 8px;

  color:#d86b5f;

  font-family:
    Georgia,
    serif;

  letter-spacing:3px;
}

.dlDefeatBox p{

  margin:
    0 0 16px;

  color:#bba889;

  font-size:12px;

  line-height:1.7;
}

.dlRestart{

  width:100%;
  height:48px;

  border-radius:5px;

  background:
    linear-gradient(
      180deg,
      #7b2e32,
      #421419
    );

  border:
    1px solid #c58a72;

  color:#f1d7ad;

  font-weight:900;
}

/* Enemy damage to player */

.dlPlayerDamage{

  position:absolute;

  left:50%;
  top:70%;

  transform:
    translate(-50%,-50%);

  z-index:25;

  color:#ff7d6e;

  font-weight:1000;

  font-size:20px;

  text-shadow:
    0 0 10px #000;

  animation:
    dlPlayerDmg .55s forwards;

  pointer-events:none;
}

@keyframes dlPlayerDmg{

  0%{
    opacity:1;
    transform:
      translate(-50%,0)
      scale(.8);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-55px)
      scale(1.1);
  }
}

@media(max-height:680px){

  .stage{
    min-height:230px!important;
  }

  .enemyVisual{
    height:105px!important;
  }

  .dlHeroArt{
    transform:
      translateX(-50%)
      scale(.82);

    transform-origin:
      bottom;
  }

  .playerPanel{
    padding:7px!important;
  }
}
</style>


<script>

/* =====================================================
   DARK LOOT V2.5 GAMEPLAY PATCH
===================================================== */

(function(){

  function initPatch(){

    const autoBtn =
      document.getElementById("autoButton");

    const attackBtn =
      document.getElementById("attackButton");

    const stage =
      document.querySelector(".stage");

    if(
      !autoBtn ||
      !attackBtn ||
      !stage
    ){
      return;
    }


    /* =====================================
       AUTO TOUCH FIX
    ===================================== */

    if(!autoBtn.dataset.dlBound){

      autoBtn.dataset.dlBound="1";

      autoBtn.addEventListener(
        "pointerdown",
        function(e){

          e.preventDefault();
          e.stopPropagation();

          if(
            typeof toggleAuto === "function"
          ){

            toggleAuto();

          }

        },
        {
          passive:false
        }
      );

    }


    /* =====================================
       ADVENTURER
    ===================================== */

    if(
      !stage.querySelector(".dlHeroArt")
    ){

      const hero =
        document.createElement("div");

      hero.className="dlHeroArt";

      hero.innerHTML=`

        <div class="cape"></div>

        <div class="head"></div>

        <div class="body"></div>

        <div class="sword"></div>

        <div class="guard"></div>

        <div class="shield"></div>

      `;

      stage.appendChild(hero);

    }


    /* =====================================
       DEFEAT MODAL
    ===================================== */

    if(
      !document.getElementById(
        "dlDefeatModal"
      )
    ){

      const modal =
        document.createElement("div");

      modal.id="dlDefeatModal";

      modal.className=
        "dlDefeatModal";

      modal.innerHTML=`

        <div class="dlDefeatBox">

          <h2>
            YOU DIED
          </h2>

          <p>

            力尽きてしまった……<br>

            この階層から
            もう一度挑戦できます。

          </p>

          <button
            class="dlRestart"
            id="dlRestartBtn"
          >
            ⚔ 再戦する
          </button>

        </div>

      `;

      document
        .getElementById("app")
        .appendChild(modal);


      document
        .getElementById("dlRestartBtn")
        .addEventListener(
          "pointerdown",
          function(e){

            e.preventDefault();
            e.stopPropagation();

            restartBattle();

          },
          {
            passive:false
          }
        );

    }


    /* =====================================
       ENEMY AI
    ===================================== */

    if(
      !window.__dlEnemyTimer
    ){

      window.__dlEnemyTimer =
        setInterval(
          enemyTurn,
          1450
        );

    }


    /* =====================================
       AUTO STATE
    ===================================== */

    if(
      typeof updateAuto === "function"
    ){

      updateAuto();

    }

  }


  /* =====================================
     ENEMY ATTACK
  ===================================== */

  function enemyTurn(){

    try{

      const battle =
        document.getElementById(
          "battleScreen"
        );

      if(
        !battle ||
        !battle.classList.contains(
          "active"
        )
      ){

        return;

      }


      if(
        typeof enemy === "undefined" ||
        enemy.defeated
      ){

        return;

      }


      if(
        typeof game === "undefined"
      ){

        return;

      }


      if(
        game.hp <= 0
      ){

        return;

      }


      const base =

        16 +

        Math.floor(
          game.floor * 2.4
        );


      const bossBonus =
        enemy.boss
          ? 2.4
          : 1;


      const defense =

        typeof getDefense === "function"

          ? getDefense()

          : 0;


      let damage =

        Math.floor(
          base *
          bossBonus -

          defense *
          .55
        );


      damage =
        Math.max(
          1,
          damage
        );


      game.hp =
        Math.max(
          0,
          game.hp - damage
        );


      showPlayerDamage(
        damage
      );


      updateBattleUI();


      if(
        typeof saveGame === "function"
      ){

        saveGame();

      }


      if(
        game.hp <= 0
      ){

        playerDefeated();

      }

    }

    catch(err){

      console.warn(
        "DARK LOOT enemyTurn:",
        err
      );

    }

  }


  /* =====================================
     PLAYER DAMAGE
  ===================================== */

  function showPlayerDamage(
    value
  ){

    const stage =
      document.querySelector(
        ".stage"
      );

    if(!stage)return;


    const d =
      document.createElement(
        "div"
      );

    d.className=
      "dlPlayerDamage";

    d.textContent=
      "-" + value;

    stage.appendChild(d);


    setTimeout(
      function(){

        d.remove();

      },
      600
    );

  }


  /* =====================================
     PLAYER DEFEATED
  ===================================== */

  function playerDefeated(){

    try{

      game.hp=0;

      game.auto=false;


      if(
        typeof updateAuto === "function"
      ){

        updateAuto();

      }


      if(
        typeof autoTimer !== "undefined" &&
        autoTimer
      ){

        clearInterval(
          autoTimer
        );

        autoTimer=null;

      }


      if(
        typeof saveGame === "function"
      ){

        saveGame();

      }


      document
        .getElementById(
          "dlDefeatModal"
        )
        .classList
        .add("show");

    }

    catch(err){

      console.warn(
        "DARK LOOT defeat:",
        err
      );

    }

  }


  /* =====================================
     RESTART
  ===================================== */

  window.restartBattle =
    function(){

      try{

        const max =

          typeof getMaxHp === "function"

            ? getMaxHp()

            : 100;


        game.hp=max;

        game.auto=false;


        if(
          typeof updateAuto === "function"
        ){

          updateAuto();

        }


        if(
          typeof autoTimer !== "undefined" &&
          autoTimer
        ){

          clearInterval(
            autoTimer
          );

          autoTimer=null;

        }


        if(
          typeof createEnemy === "function"
        ){

          createEnemy();

        }


        document
          .getElementById(
            "dlDefeatModal"
          )
          .classList
          .remove("show");


        if(
          typeof updateBattleUI === "function"
        ){

          updateBattleUI();

        }


        if(
          typeof saveGame === "function"
        ){

          saveGame();

        }

      }

      catch(err){

        console.warn(
          "DARK LOOT restart:",
          err
        );

      }

    };


  /* =====================================
     START
  ===================================== */

  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      initPatch
    );

  }else{

    setTimeout(
      initPatch,
      0
    );

  }

})();

</script>
